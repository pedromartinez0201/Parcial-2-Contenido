   d diagrama (clave de DIAGRAMS), m respuesta modelo, r criterios de autoevaluación, f fuente. */
const OPEN=[
/* ---------- Desarrollo ---------- */
{id:'D01',open:'dev',t:'est',s:'N',q:`Nombre las partes de una transición en un diagrama de estados y su sintaxis. Si se pasa del estado X (exit: A) al estado Y (entry: C) mediante la transición E / B, ¿en qué orden se ejecutan las acciones?`,
 m:`Una transición tiene cinco partes: estado origen, evento de disparo, condición de guarda, acción y estado destino.
Sintaxis: evento [condición] / acción.

La guarda se evalúa cuando ocurre el evento; si es falsa, la transición no se dispara.

Orden: A → B → C. Primero el exit del estado origen, después la acción de la transición y por último el entry del estado destino.`,
 r:[`Nombra las cinco partes: origen, evento, guarda, acción y destino.`,`Da la sintaxis evento [condición] / acción.`,`Explica que la guarda se evalúa al ocurrir el evento y, si es falsa, no hay transición.`,`Ordena bien: A (exit), B (acción), C (entry).`],f:'U4.3 · Transiciones'},
{id:'D02',open:'dev',t:'est',s:'N',q:`Diferencie una acción de transición, una transición interna (on evento) y una transición λ. Mencione los cuatro tipos de eventos.`,
 m:`Acción de transición: se ejecuta al cambiar de estado y es atómica.
Transición interna (on evento / acción): responde al evento sin salir del estado, por lo que no ejecuta exit ni entry.
Transición λ: no requiere evento; se dispara sola cuando desaparece la condición que identifica al estado.

Tipos de eventos: señal (asincrónica), llamada (sincrónica), paso del tiempo y cambio de estado.`,
 r:[`La acción de transición ocurre al cambiar de estado y es atómica.`,`La transición interna no sale del estado: no ejecuta exit ni entry.`,`La transición λ no necesita evento.`,`Nombra los cuatro eventos: señal, llamada, tiempo y cambio.`],f:'U4.3 · Eventos y transiciones'},
{id:'D03',open:'dev',t:'sec',s:'N',q:`Diferencie mensaje síncrono y asíncrono en un diagrama de secuencia. Explique los fragmentos alt, opt y loop, con un ejemplo de cada uno.`,
 m:`Síncrono: el emisor espera a que el receptor termine (una llamada a un método). Se dibuja con punta de flecha llena y suele tener mensaje de retorno.
Asíncrono: el emisor sigue sin esperar. Punta de flecha abierta.

alt: alternativa con varios operandos y guardas; se ejecuta uno solo. Ej.: [sin resultados] mostrar mensaje / [con resultados] mostrar grilla.
opt: una sola secuencia que se ejecuta o no según la guarda. Ej.: [cliente frecuente] aplicar descuento.
loop: repite la secuencia mientras se cumpla la guarda. Ej.: para cada ítem del pedido, calcular subtotal.`,
 r:[`Síncrono espera la respuesta; asíncrono no.`,`alt tiene varios operandos y se ejecuta uno solo.`,`opt tiene una sola secuencia que se ejecuta o no.`,`loop repite mientras se cumpla la guarda.`,`Da un ejemplo válido para cada fragmento.`],f:'U4 · Diagrama de secuencia'},
{id:'D04',open:'dev',t:'sec',s:'E',x:'Final 03/2012',q:`Indique diferencias y coincidencias entre el diagrama de secuencia y el de colaboración (comunicación).`,
 m:`Coincidencias: los dos son diagramas de interacción, muestran objetos que intercambian mensajes para realizar un caso de uso y son semánticamente equivalentes: uno se puede convertir en el otro.

Diferencias:
- Secuencia enfatiza el orden temporal: el tiempo corre hacia abajo, con líneas de vida y barras de activación. Muestra bien fragmentos (alt, opt, loop), creación y destrucción.
- Colaboración enfatiza los vínculos estructurales entre objetos: los objetos se ubican libremente y los mensajes van numerados (1, 1.1, 2…) sobre los enlaces.`,
 r:[`Dice que ambos son diagramas de interacción equivalentes.`,`Secuencia enfatiza el tiempo (líneas de vida, eje vertical).`,`Colaboración enfatiza los vínculos entre objetos.`,`Menciona que en colaboración los mensajes se numeran.`],f:'U4 · Secuencia vs. colaboración'},
{id:'D05',open:'dev',t:'comp',s:'E',x:'Final 03/2012',q:`¿Qué es un subsistema? Ejemplifique y diferéncielo de un paquete.`,
 m:`Un subsistema es una agrupación de elementos de diseño (clases, interfaces) que ofrece su comportamiento a través de interfaces bien definidas y oculta su implementación: su contenido no es accesible desde afuera.

Un paquete solo agrupa y organiza elementos; no exhibe comportamiento propio.

Ejemplo: «subsystem» Pagos, que expone la interfaz IPagos (cobrar, reintegrar) y oculta las clases que hablan con cada pasarela. Una fachada es una forma típica de exponer esa interfaz.`,
 r:[`Expone comportamiento mediante interfaces.`,`Encapsula u oculta su contenido.`,`El paquete solo agrupa, sin comportamiento.`,`Da un ejemplo concreto con su interfaz.`],f:'U4.2 · Subsistemas'},
{id:'D06',open:'dev',t:'comp',s:'N',q:`¿Qué es un componente? Mencione sus características y diferencie interfaz provista de interfaz requerida.`,
 m:`Un componente es una parte modular, desplegable y reemplazable de un sistema, que encapsula su implementación y expone un conjunto de interfaces. Es cohesivo: representa un bloque significativo de comportamiento o estructura.

Interfaz provista (lollipop ○): lo que el componente ofrece a otros.
Interfaz requerida (socket ◡): lo que el componente necesita de otro para funcionar.`,
 r:[`Modular, desplegable y reemplazable.`,`Encapsula la implementación y expone interfaces.`,`Provista = lo que ofrece (lollipop).`,`Requerida = lo que necesita (socket).`],f:'U4.2 · Componentes'},
{id:'D07',open:'dev',t:'desp',s:'E',x:'Final 03/2012',q:`Dé un ejemplo de división de componentes lógicos en capas físicas (tiers) y represéntelo con un diagrama de despliegue: nodos, artefactos, protocolos y relaciones.`,
 m:`Ejemplo en 3 tiers:
1. Cliente: «device» PC del usuario con «executionEnvironment» Navegador (presentación).
2. Servidor de aplicaciones: «device» Servidor con «executionEnvironment» Tomcat, donde se despliega app.war (gestores y DAOs).
3. Servidor de base de datos: «device» Servidor BD con «executionEnvironment» PostgreSQL y el artefacto esquema.sql.

Comunicación: Navegador —«HTTPS»— Tomcat —«JDBC»— PostgreSQL.
Relaciones: «deploy» de app.war en Tomcat; «manifest» de app.war hacia los componentes de negocio y persistencia que implementa.

En los nodos van artefactos (archivos), no clases.`,
 r:[`Separa al menos 3 tiers con su responsabilidad.`,`Distingue «device» (hardware) de «executionEnvironment» (software anidado).`,`Ubica artefactos en los nodos (no clases).`,`Indica protocolos de comunicación entre nodos.`,`Usa «deploy» y «manifest» correctamente.`],f:'U4.2 · Diagrama de despliegue'},
{id:'D08',open:'dev',t:'ss',s:'C',x:'Clase 11/06',q:`Un pedido pasa por RECIBIDO, EN PREPARACIÓN, LISTO y ENTREGADO, y puede cancelarse desde algunos estados. Explique por qué resolverlo con un atributo String y if/else es un mal diseño, y cómo lo resuelve el patrón State (intención y participantes).`,
 m:`Problemas del if/else: cada estado nuevo obliga a modificar todos los métodos; la lógica queda dispersa; hay alto riesgo de errores (estados olvidados o mal escritos); es difícil de probar; y viola el principio Abierto/Cerrado.

State (patrón de comportamiento). Intención: permitir que un objeto modifique su comportamiento cuando cambia su estado interno; parecerá que cambia de clase.
Participantes:
- Contexto (Pedido): guarda una referencia al estado actual, le delega las operaciones y expone un setter para cambiarlo.
- Estado (EstadoPedido): interfaz que declara las operaciones que dependen del estado.
- Estados concretos (Recibido, EnPreparacion, Listo…): implementan las operaciones y realizan las transiciones.`,
 r:[`Menciona al menos dos problemas del if/else.`,`Relaciona el problema con la violación de Abierto/Cerrado.`,`Da la intención del patrón.`,`Describe Contexto, Estado y Estados concretos.`,`Explica que el contexto delega en el estado actual.`],f:'U5.1 · State · Clase 11/06'},
{id:'D09',open:'dev',t:'ss',s:'N',q:`Describa el patrón Singleton: intención, elementos que garantizan una única instancia y una desventaja de usarlo.`,
 m:`Singleton es un patrón de creación. Intención: garantizar que una clase tenga una única instancia y dar un punto de acceso global a ella.

Elementos: constructor privado; atributo estático que guarda la instancia; método estático getInstance() que la crea la primera vez y después la devuelve; clase no clonable; y sincronización (synchronized) si hay varios hilos.

Desventajas: introduce un estado global que acopla a quien lo usa, dificulta las pruebas (no se puede reemplazar fácilmente por un doble) y puede esconder dependencias.`,
 r:[`Da la intención: una sola instancia con acceso global.`,`Constructor privado.`,`Atributo y método estáticos (getInstance).`,`Menciona la concurrencia o la clonación.`,`Da una desventaja válida.`],f:'U5.1 · Singleton'},
{id:'D10',open:'dev',t:'fbm',s:'N',q:`Explique el patrón Facade (intención y consecuencias) y diferéncielo de Mediator.`,
 m:`Facade (estructural). Intención: proporcionar una interfaz unificada a un conjunto de interfaces de un subsistema, para que sea más fácil de usar.
Consecuencias: oculta los componentes del subsistema a los clientes, promueve el acoplamiento débil, y no impide que un cliente use directamente las clases del subsistema si lo necesita. La fachada conoce al subsistema; el subsistema no conoce a la fachada.

Mediator (comportamiento) centraliza la comunicación entre objetos colegas que, sin él, se conocerían todos con todos. Los colegas sí conocen al mediador. Su riesgo es volverse un objeto demasiado grande.

En síntesis: Facade simplifica el acceso de un cliente a un subsistema; Mediator coordina la interacción entre pares.`,
 r:[`Intención de Facade: interfaz unificada y simple.`,`No impide el uso directo del subsistema.`,`El subsistema no conoce a la fachada.`,`Mediator centraliza la comunicación entre colegas.`,`Contrasta: Facade simplifica el acceso; Mediator coordina pares.`],f:'U5.2 · Facade y Mediator'},
{id:'D11',open:'dev',t:'fbm',s:'N',q:`Un sistema envía 4 tipos de notificación (alerta, recordatorio, promoción y factura) por 3 canales (email, SMS y push). ¿Qué patrón aplicaría? Explique su estructura y cuántas clases se ahorran.`,
 m:`Bridge (estructural): desacopla una abstracción de su implementación para que ambas varíen de forma independiente.

Estructura: la abstracción Notificacion tiene una referencia (composición) a la interfaz Canal (el implementor). Las abstracciones refinadas son Alerta, Recordatorio, Promocion y Factura; los implementadores concretos son Email, SMS y Push. La notificación delega el envío en canal.enviar(...).

Con herencia harían falta 4 × 3 = 12 clases (una por combinación). Con Bridge, 4 + 3 = 7, más la abstracción y la interfaz. Agregar un canal nuevo es una sola clase.`,
 r:[`Elige Bridge.`,`Explica las dos jerarquías independientes.`,`Usa composición: la abstracción tiene una referencia al implementor.`,`Calcula 12 contra 7 clases.`],f:'U5.2 · Bridge'},
{id:'D12',open:'dev',t:'gof',s:'C',x:'Clase práctica 12/06',q:`Diferencie Factory Method de Abstract Factory. Mencione dos ventajas y dos desventajas de Abstract Factory.`,
 m:`Factory Method: una clase creadora declara un método fábrica (normalmente abstracto) que las subclases redefinen para decidir qué producto concreto instanciar. Crea un solo producto, por herencia.

Abstract Factory: una interfaz de fábrica declara un método de creación por cada producto de una familia de objetos relacionados; cada fábrica concreta crea las variantes de una misma familia. El cliente recibe la fábrica (composición) y trabaja solo con interfaces.

Ventajas: compatibilidad garantizada entre productos de la misma familia; bajo acoplamiento (aísla las clases concretas); responsabilidad única (la creación está centralizada); abierto/cerrado (se agregan familias sin tocar al cliente).
Desventajas: mayor complejidad (muchas interfaces y clases nuevas) y es difícil agregar un tipo de producto nuevo: obliga a modificar la fábrica abstracta y todas sus implementaciones.`,
 r:[`Factory Method: un método fábrica que redefinen las subclases.`,`Abstract Factory: familias de productos relacionados.`,`Dos ventajas válidas.`,`Dos desventajas, incluida la dificultad de agregar productos.`],f:'Clase práctica 12/06 · Factory Method y Abstract Factory'},
{id:'D13',open:'dev',t:'gof',s:'C',x:'Clase práctica 12/06',q:`Explique el patrón Adapter: participantes, cómo colaboran y cuándo conviene aplicarlo.`,
 m:`Adapter (estructural, también llamado Wrapper) permite que colaboren objetos con interfaces incompatibles.

Participantes:
- Cliente: contiene la lógica de negocio existente.
- Interfaz con el cliente: el protocolo que deben seguir las clases para colaborar con el cliente.
- Servicio: una clase útil (de terceros o heredada) cuya interfaz es incompatible.
- Adaptador: implementa la interfaz con el cliente y envuelve al servicio; traduce cada llamada a un formato que el servicio entiende.

Como el cliente trabaja solo con la interfaz, se pueden agregar adaptadores nuevos sin modificarlo.

Cuándo: para usar una clase existente cuya interfaz no es compatible con el resto del código (por ejemplo, una librería de logging externa que no se puede modificar), o para reutilizar subclases a las que les falta una funcionalidad común.`,
 r:[`Intención: hacer colaborar interfaces incompatibles.`,`Nombra Cliente, Interfaz, Servicio y Adaptador.`,`El adaptador implementa la interfaz y envuelve al servicio (composición).`,`Da un caso de uso concreto.`],f:'Clase práctica 12/06 · Adapter'},
{id:'D14',open:'dev',t:'dao',s:'N',q:`Diferencie DAO de DTO. Explique por qué el DAO se define como interfaz y cuál es el error típico al combinarlos.`,
 m:`DAO (Data Access Object): encapsula el acceso a la base de datos; es el único que habla con la persistencia y ofrece operaciones CRUD (añadir, buscar, actualizar, borrar). Trabaja con entidades.

DTO (Data Transfer Object): objeto que solo transporta datos entre capas o entre cliente y servidor. No tiene lógica de negocio, validaciones, cálculos ni acceso a la BD. Sirve para no exponer datos sensibles y armar la vista que necesita cada pantalla.

El DAO se define como interfaz para tener varias implementaciones (MySQL, Mongo, Fake para pruebas) sin que el resto del sistema se entere. Es inversión de dependencias (DIP): la lógica depende de una abstracción.

Error típico: que el DAO devuelva un DTO. El DAO devuelve entidades y el gestor arma el DTO; si no, el DAO queda atado a una pantalla.`,
 r:[`DAO encapsula la persistencia (CRUD).`,`DTO solo transporta datos, sin lógica.`,`Interfaz para cambiar implementaciones (DIP).`,`El error típico: el DAO no debe devolver DTO.`],f:'U5 · Práctica DAO y DTO'},
{id:'D15',open:'dev',t:'solid',s:'N',q:`Explique los principios Abierto/Cerrado (OCP) y de Sustitución de Liskov (LSP). Para cada uno, dé un ejemplo de violación y cómo se corrige.`,
 m:`OCP: las entidades de software deben estar abiertas a la extensión y cerradas a la modificación. Para agregar comportamiento se agregan clases, no se modifica código ya probado.
Violación: un método con if (pago es Tarjeta)… else if (pago es Efectivo)…; cada medio nuevo obliga a modificarlo.
Corrección: una interfaz IMedioPago con procesar(), que implementa cada medio.

LSP: una subclase debe poder sustituir a su clase base sin romper el comportamiento esperado por el cliente.
Violación: Pinguino hereda de Ave y su Volar() lanza una excepción.
Corrección: sacar Volar() a una interfaz IVolador que solo implementan las aves que vuelan.`,
 r:[`Define OCP: abierto a extensión, cerrado a modificación.`,`Ejemplo y corrección de OCP.`,`Define LSP: la subclase sustituye a la base.`,`Ejemplo y corrección de LSP.`],f:'U5.4 · SOLID'},
{id:'D16',open:'dev',t:'solid',s:'N',q:`Explique el principio de Inversión de Dependencias (DIP) y diferéncielo de la Inversión de Control (IoC) y la Inyección de Dependencias (DI).`,
 m:`DIP: los módulos de alto nivel no deben depender de los de bajo nivel; ambos deben depender de abstracciones. Los detalles dependen de las abstracciones, no al revés. Ej.: GestorLibro depende de la interfaz LibroDAO, no de LibroDAOMySQL.

IoC: el control de crear y gestionar los objetos pasa a una entidad externa (un framework o contenedor).
DI: una forma concreta de IoC, en la que las dependencias se reciben desde afuera: por constructor, propiedad o método.

Toda DI es IoC, pero no toda IoC es DI (también hay IoC con callbacks o eventos). DIP es un principio de diseño; DI es una técnica que ayuda a cumplirlo.`,
 r:[`Define DIP: depender de abstracciones.`,`Da un ejemplo de DIP.`,`Define IoC.`,`Define DI y sus formas (constructor, propiedad, método).`,`Toda DI es IoC, no al revés.`],f:'U5.4 · SOLID'},
{id:'D17',open:'dev',t:'arq',s:'E',x:'Parcial 2 2011',q:`¿Qué implica el diseño de la arquitectura? Describa la subactividad "Identificación de los mecanismos".`,
 m:`Diseñar la arquitectura es definir la estructura general del sistema antes del diseño detallado. Implica: identificar los nodos y la configuración de red; descomponer en capas y subsistemas con sus interfaces; identificar los mecanismos generales; identificar las clases de diseño significativas para la arquitectura; buscar oportunidades de reutilización y software de terceros.

Identificación de los mecanismos: consiste en encontrar soluciones comunes a problemas técnicos que atraviesan todo el sistema, como persistencia, distribución, rendimiento, seguridad, transacciones o manejo de errores. Se documentan en la vista lógica con diagramas de clases (qué clases participan) y de interacción (cómo colaboran). Ejemplo: el patrón DAO es un mecanismo de persistencia.`,
 r:[`Estructura general antes del diseño detallado.`,`Nombra al menos tres actividades (nodos, capas y subsistemas, mecanismos, clases significativas).`,`Mecanismo = solución común a un problema técnico transversal.`,`Da ejemplos de mecanismos (persistencia, distribución…).`],f:'U5.5 · Arquitectura'},
{id:'D18',open:'dev',t:'arq',s:'N',q:`Diferencie capa lógica (layer) de capa física (tier). ¿Qué problema aparece si, en una arquitectura de capas cerradas, la presentación consulta directamente la persistencia?`,
 m:`Capa lógica (layer): agrupación conceptual de responsabilidades, como presentación, negocio y datos.
Capa física (tier): la distribución real en nodos o procesos de ejecución (cliente, servidor de aplicaciones, servidor de base de datos). Varias capas lógicas pueden correr en un mismo tier.

En capas cerradas, cada capa solo usa a la inmediata inferior. Si la presentación consulta la persistencia, se saltea la capa de negocio: se rompe el aislamiento entre capas, la interfaz queda acoplada a los detalles de los datos, la lógica de negocio se duplica o se pierde, y un cambio en la persistencia impacta en la presentación.`,
 r:[`Layer = separación lógica de responsabilidades.`,`Tier = distribución física en nodos o procesos.`,`En capas cerradas solo se usa la capa inmediata inferior.`,`Saltear capas rompe el aislamiento y acopla presentación y datos.`],f:'U5.5 · Arquitectura'},
{id:'D19',open:'dev',t:'cn',s:'E',x:'Final 03/2012',q:`Explique el método de partición de equivalencia y complételo con un ejemplo.`,
 m:`Es una técnica de caja negra. Se divide el dominio de entrada en un número finito de clases, de modo que probar un representante equivalga a probar cualquier valor de esa clase.

Pasos: (1) identificar las condiciones de entrada en la especificación; (2) dividir cada una en clases válidas e inválidas; (3) numerarlas; (4) escribir casos que cubran tantas clases válidas como se pueda; (5) escribir un caso por cada clase inválida, con el resto de los datos válidos.

Ejemplo: cantidad entre 1 y 999 y nombre que empieza con letra.
Clases: (1) 1–999 válida, (2) < 1, (3) > 999, (4) empieza con letra válida, (5) empieza con número.
Casos: (500, "Ana") → 1 y 4; (0, "Ana") → 2; (1000, "Ana") → 3; (500, "7up") → 5.`,
 r:[`Es caja negra y busca representantes de cada clase.`,`Distingue clases válidas e inválidas.`,`Las válidas se combinan; las inválidas van de a una.`,`Da un ejemplo con clases y casos.`],f:'U6.1 · Particiones de equivalencia'},
{id:'D20',open:'dev',t:'cn',s:'E',x:'Final 03/2012',q:`Un programa recibe tres lados y clasifica el triángulo en equilátero, isósceles o escaleno. Formule el lote de pruebas e indique el criterio usado.`,
 m:`Criterio: caja negra, con particiones de equivalencia, valores límite y conjetura de errores. Cada caso lleva su salida esperada.

Válidos: (3, 4, 5) escaleno · (3, 3, 3) equilátero · (3, 3, 4) isósceles, más sus permutaciones (3, 4, 3) y (4, 3, 3).
Límite de la desigualdad triangular: (1, 2, 3), donde un lado es igual a la suma de los otros, con permutaciones → no es triángulo. (2, 2, 4) → no es triángulo.
Inválidos: un lado en 0 (0, 4, 5); un lado negativo (-3, 4, 5); un lado mayor que la suma de los otros (1, 2, 5) con permutaciones; todos en cero.
Conjetura: datos no numéricos, decimales, menos de tres valores.`,
 r:[`Indica el criterio (equivalencia, límites, conjetura).`,`Incluye un caso válido de cada tipo de triángulo.`,`Prueba permutaciones.`,`Incluye el límite: un lado igual a la suma de los otros.`,`Incluye inválidos (cero, negativos, no numéricos) con salida esperada.`],f:'U6.1 · Caja negra'},
{id:'D21',open:'dev',t:'cb',s:'E',x:'Banco de preguntas 2004',q:`¿Cuándo se usan las pruebas de caja blanca? Explique los criterios de cobertura de sentencias, decisiones y condiciones.`,
 m:`Se usan cuando se tiene acceso al código fuente, típicamente en la prueba de unidad o de módulo: se analiza la lógica interna y después se complementa con caja negra contra la especificación. También al final, para completar la cobertura que no alcanzaron los casos de caja negra. No sirve sola: no detecta funcionalidad faltante.

Cobertura de sentencias: cada sentencia se ejecuta al menos una vez (el criterio más débil).
Cobertura de decisiones: cada decisión toma al menos una vez el valor verdadero y una vez el falso; incluye la de sentencias.
Cobertura de condiciones: cada condición simple dentro de una decisión toma ambos valores.`,
 r:[`Se usa con acceso al código, en la prueba de unidad.`,`Se complementa con caja negra; sola no detecta lo que falta.`,`Explica cobertura de sentencias.`,`Explica cobertura de decisiones (V y F en cada una).`,`Explica cobertura de condiciones.`],f:'U6.1 · Caja blanca'},
{id:'D22',open:'dev',t:'pru',s:'E',x:'Banco de preguntas',q:`¿Qué métodos de debugging conoce? ¿En qué se diferencia un caso de prueba para pruebas de uno para debugging?`,
 m:`Métodos sistemáticos: inducción (de los síntomas a una hipótesis), deducción (se enumeran las causas posibles y se van eliminando), rastreo hacia atrás (desde donde se ve el error hacia el origen) y por medio de pruebas (casos específicos para ubicar el error).
Métodos asistemáticos: vuelco de memoria, esparcimiento de sentencias (imprimir valores por todo el programa) y uso de debuggers.

Un caso para pruebas busca exponer errores nuevos y es "gordo": cubre muchas condiciones con pocos casos. Un caso para debugging busca información para ubicar un error ya detectado y es "delgado": cubre una o pocas condiciones, como variantes del caso original.`,
 r:[`Nombra métodos sistemáticos (inducción, deducción, rastreo).`,`Nombra métodos asistemáticos.`,`Prueba: encontrar errores nuevos, casos "gordos".`,`Debugging: ubicar un error conocido, casos "delgados".`],f:'U6.1 · Debugging'},
{id:'D23',open:'dev',t:'pru',s:'E',x:'Banco de preguntas',q:`Describa una inspección de software: quiénes participan, cómo se realiza y cuál es su objetivo.`,
 m:`Es la lectura del programa por un equipo con el objetivo de encontrar errores, no de corregirlos.

Participantes: idealmente un moderador, el programador, el diseñador y un especialista en pruebas.
Desarrollo: el moderador reparte el material días antes. En la sesión, el programador narra la lógica sentencia por sentencia y el equipo revisa el código con una lista ayuda-memoria de errores frecuentes. Al final, el programador recibe la lista de errores encontrados; si son muchos, se hace una reinspección.

Los resultados son confidenciales y no deben usarse para evaluar al programador.`,
 r:[`Objetivo: encontrar errores, no corregirlos.`,`Nombra los participantes y el rol del moderador.`,`El programador narra la lógica.`,`Se usa una lista ayuda-memoria de errores frecuentes.`],f:'U6.1 · Inspecciones'},
{id:'D24',open:'dev',t:'fin',s:'E',x:'Parcial 2 2017 (20 pts)',q:`Defina y describa los tipos de prueba que conoce con y sin usuarios presentes.`,
 m:`Con usuarios presentes:
- Aceptación (UAT): el usuario final valida el sistema en un entorno de prueba, antes de producción, contra sus requerimientos.
- Alfa: usuarios representativos en el sitio del desarrollador, con el desarrollador presente, en un ambiente controlado.
- Beta: en el sitio del usuario, sin el desarrollador, en un ambiente real; el cliente reporta los problemas.
- Facilidad de uso: se mide aprendizaje, tiempos, errores y satisfacción de usuarios reales.

Sin usuarios presentes (las hace el equipo técnico):
- Unidad: cada clase o función aislada.
- Integración: módulos ya probados, juntos (incremental, descendente o ascendente).
- Función: contra la especificación externa.
- Humo y regresión: lo básico funciona, y los cambios no rompieron lo anterior.
- Sistema: contra los objetivos originales: volumen, esfuerzo, performance, seguridad, configuración, recuperación, instalación.`,
 r:[`Aceptación (UAT) con el usuario final.`,`Alfa: en el sitio del desarrollador, con él presente.`,`Beta: en el sitio del usuario, sin el desarrollador.`,`Al menos tres tipos sin usuarios (unidad, integración, sistema…).`,`Describe cada uno, no solo los nombra.`],f:'U6.2 · Tipos de pruebas'},
{id:'D25',open:'dev',t:'fin',s:'E',x:'Final 07/2012',q:`Explique cuándo se da por finalizada una prueba.`,
 m:`No hay que terminar "cuando se acaba el tiempo" ni "cuando todos los casos pasan sin errores": eso contradice la definición de prueba.

Tres categorías de criterio:
1. Por métodos de diseño de casos: se ejecutaron todos los casos de valores límite, equivalencia y conjetura, y ya no encuentran errores. Útil para componentes.
2. En términos positivos: encontrar un número estimado de errores.
3. Por la curva de errores por unidad de tiempo: cuando se aplana, la prueba se volvió improductiva.

El mejor criterio es combinar los tres. Para función y sistema: parar al llegar al número estimado de errores o al tiempo fijado, lo que ocurra más tarde, si la curva muestra que ya rinde poco.`,
 r:[`Descarta "se acabó el tiempo" y "no aparecen errores".`,`Criterio por métodos de diseño de casos.`,`Criterio por número estimado de errores.`,`Criterio por la curva de errores.`,`Recomienda combinarlos.`],f:'U6.2 · ¿Cuándo terminar las pruebas?'},
{id:'D26',open:'dev',t:'fin',s:'E',x:'Parcial 2 2017 y 2011',q:`Formule un plan de pruebas para una organización con tres programadores y explique en qué circunstancias lo daría por terminado.`,
 m:`Componentes del plan:
1. Objetivos por fase: unidad (cada módulo cumple su especificación), integración (las interfaces funcionan), sistema (cumple los objetivos, incluidos los no funcionales) y aceptación (el usuario lo aprueba).
2. Criterios de terminación por fase.
3. Cronograma: cuándo se diseñan y ejecutan los casos de cada fase.
4. Responsabilidades: nadie prueba su propio código. Cada programador prueba los módulos de otro, con rotación.
5. Recursos: entorno de prueba, datos, herramientas (CI, automatización de regresión).

Lo daría por terminado con una combinación de criterios positivos: se ejecutaron los casos de límites, equivalencia y conjetura con la cobertura acordada; se encontró la cantidad estimada de errores; la curva de errores por semana se aplanó; no quedan defectos críticos abiertos; y el usuario firmó la aceptación.`,
 r:[`Incluye los cinco componentes: objetivos, criterios, cronograma, responsabilidades, recursos.`,`Aplica que nadie prueba su propio código.`,`Cubre las fases unidad, integración, sistema y aceptación.`,`Terminación con criterios positivos combinados.`],f:'U6.2 · Planeamiento de la prueba'},
{id:'D27',open:'dev',t:'niv',s:'N',q:`Compare la integración incremental con la no incremental (big bang). Diferencie la integración descendente de la ascendente e indique qué son los stubs y los drivers.`,
 m:`No incremental (big bang): se prueban los módulos por separado y después se juntan todos a la vez. Cuando aparece una falla, es difícil saber dónde está.
Incremental: se agrega un módulo por vez; la falla apunta al último módulo agregado. Es la preferida.

Descendente: se empieza por el módulo principal y se baja. Los módulos llamados que todavía no existen se reemplazan con stubs, que simulan al módulo llamado. Permite ver temprano un esqueleto del sistema.
Ascendente: se empieza por los módulos de más bajo nivel. Se usan drivers, que simulan al módulo llamador.`,
 r:[`Big bang: todo junto, falla difícil de ubicar.`,`Incremental: un módulo por vez, la falla apunta al último.`,`Descendente usa stubs (simulan al llamado).`,`Ascendente usa drivers (simulan al llamador).`],f:'U6.2 · Integración'},
{id:'D28',open:'dev',t:'conv',s:'E',x:'Final 07/2012',q:`Nombre las estrategias de conversión de programas y explique las desventajas de la conversión en paralelo.`,
 m:`Estrategias: total (big bang, en una fecha de corte), paralela (conviven el sistema viejo y el nuevo), gradual (por partes o módulos), distribuida (sede por sede, empezando por las más chicas) y por prototipado. Se pueden combinar, por ejemplo distribuida y paralela en cada sede.

Desventajas de la paralela:
- Es la más cara: doble operación y doble carga de datos.
- Requiere un gran manejo del personal.
- Los usuarios se cansan de cargar todo dos veces.
- Hay que comparar y conciliar los resultados de ambos sistemas.

Su ventaja es el menor riesgo: si el nuevo falla, el viejo sigue operando.`,
 r:[`Nombra al menos cuatro estrategias.`,`Paralela: la más cara, doble operación y carga.`,`Paralela: desgaste de usuarios y manejo de personal.`,`Menciona que las estrategias se pueden combinar o la ventaja del menor riesgo.`],f:'U6.3 · Conversión de programas'},
{id:'D29',open:'dev',t:'rel',s:'N',q:`Explique el versionado semántico (major, minor, patch) y describa las estrategias de despliegue blue-green, canary, rolling y feature flags.`,
 m:`Versionado semántico MAJOR.MINOR.PATCH:
- Major: cambios incompatibles con la versión anterior.
- Minor: funcionalidades nuevas compatibles.
- Patch: correcciones de errores compatibles.

Estrategias de despliegue:
- Blue-green: dos entornos idénticos; se pasa el tráfico del viejo (blue) al nuevo (green) de una vez, y se puede volver atrás rápido.
- Canary: se libera primero a un grupo chico de usuarios y se amplía si todo anda bien.
- Rolling: se actualiza de a pocos servidores por vez, sin cortes, aunque conviven dos versiones durante un tiempo.
- Feature flags: el código se despliega apagado y se enciende por funcionalidad; separa desplegar de liberar.

Toda estrategia necesita un rollback definido y probado.`,
 r:[`Major = incompatible; minor = nueva compatible; patch = corrección.`,`Blue-green: dos entornos y cambio de tráfico.`,`Canary: primero a pocos usuarios.`,`Rolling: de a pocos servidores, conviven versiones.`,`Feature flags: separa desplegar de liberar.`],f:'U6.3 · Gestión de liberaciones'},
{id:'D30',open:'dev',t:'impl',s:'N',q:`Explique en qué consiste la conversión de datos y la de procedimientos. Diferencie la capacitación ejecutiva de la operativa.`,
 m:`Conversión de datos (migración): la información sobrevive a los sistemas y hay que llevarla al nuevo. Se extrae, se transforma (limpiar, mapear, convertir), se carga y se valida. Hay que conocer las tecnologías de origen y destino, y su costo puede igualar al de desarrollar el sistema; se planifica desde el inicio.

Conversión de procedimientos: los procedimientos de trabajo cambian o se rediseñan (reingeniería de procesos). Puede ser traumática y requiere gestión del cambio: explicar el porqué, involucrar a usuarios clave y acompañar la adopción.

Capacitación ejecutiva: muestra el qué (problemas que resuelve, beneficios, indicadores); es "vender el producto".
Capacitación operativa: muestra el qué y el cómo, para quienes van a usar el sistema día a día.`,
 r:[`Datos: extraer, transformar, cargar y validar.`,`El costo de migrar puede igualar al del desarrollo.`,`Procedimientos: reingeniería y gestión del cambio.`,`Ejecutiva = el qué; operativa = el qué y el cómo.`],f:'U6.3 · Implementación'},

/* ---------- Diagrama de clases → pseudocódigo ---------- */
{id:'U01',open:'uml',t:'uml',s:'E',x:'Parcial 1 2026',d:'hotel',q:`Generar el código fuente del siguiente diagrama de clases (puede plantearlo en un lenguaje conocido o bien en pseudocódigo).`,
 m:`Enum EstadoHabitacion
    OCUPADA
    RESERVADA
FinEnum

Clase ResponsableReserva
    + apellido: String
    + nombre: String
FinClase

Clase Habitacion
    + numero: Entero
    + estado: EstadoHabitacion
FinClase

Clase HabitacionPremium HeredaDe Habitacion
    + poseeTV: Booleano
FinClase

// Clase de asociación: guarda los datos del vínculo
// entre un responsable y una habitación.
Clase Reserva
    + fechaIngreso: Fecha
    + fechaEgreso: Fecha
    + responsable: ResponsableReserva
    + habitacion: Habitacion
FinClase

// Asociación navegable Ocupacion (*) --> (1) Habitacion:
// solo Ocupacion conoce a Habitacion.
Clase Ocupacion
    + fechaIngreso: Fecha
    + fechaEgreso: Fecha
    + habitacion: Habitacion
FinClase

Interfaz IGestorHabitacion
    - guardarHabitacion()
FinInterfaz

// Dependencia: usa Habitacion sin guardarla como atributo.
Clase GestorHabitacion Implementa IGestorHabitacion
    - guardarHabitacion()
        h: Habitacion = nueva Habitacion()
        ...
    FinMetodo
FinClase

Relaciones:
Herencia: HabitacionPremium HeredaDe Habitacion
Asociación: Ocupacion (*) -> Habitacion (1)
Clase de asociación: Reserva vincula ResponsableReserva y Habitacion
Implementación: GestorHabitacion Implementa IGestorHabitacion
Dependencia: GestorHabitacion dependeDe Habitacion`,
 r:[`Declara EstadoHabitacion como Enum (OCUPADA, RESERVADA) y lo usa como tipo de Habitacion.estado.`,`HabitacionPremium HeredaDe Habitacion y solo agrega poseeTV, sin repetir lo heredado.`,`Ocupacion tiene un atributo habitacion: Habitacion, y Habitacion no guarda ocupaciones (navegabilidad).`,`Reserva es la clase de asociación: además de las fechas, referencia a ResponsableReserva y a Habitacion.`,`IGestorHabitacion es una Interfaz y GestorHabitacion la Implementa con guardarHabitacion().`,`La dependencia hacia Habitacion no aparece como atributo de GestorHabitacion.`,`Respeta la visibilidad y los tipos del diagrama.`],f:'Parcial 1 2026 · Reservas de hotel'},
{id:'U02',open:'uml',t:'uml',s:'N',d:'factura',q:`Escriba el pseudocódigo de las clases del diagrama. Incluya el cuerpo de agregarLinea, calcularTotal y subtotal, y los constructores que hagan falta.`,
 m:`Enum TipoFactura
    A
    B
    C
FinEnum

Clase abstracta Comprobante
    # fechaEmision: Fecha
    + imprimir(): void {abstracto}
FinClase

Clase Cliente
    - cuit: String
    - razonSocial: String
FinClase

Clase Producto
    - codigo: String
    - descripcion: String
    - precio: Real
    + getPrecio(): Real
        Retornar precio
    FinMetodo
FinClase

Clase LineaFactura
    - cantidad: Entero
    - precioUnitario: Real
    - producto: Producto
    + LineaFactura(p: Producto, cantidad: Entero)
        producto = p
        this.cantidad = cantidad
        precioUnitario = p.getPrecio()
    FinMetodo
    + subtotal(): Real
        Retornar cantidad * precioUnitario
    FinMetodo
FinClase

Clase Factura HeredaDe Comprobante
    - numero: Entero
    - fecha: Fecha
    - tipo: TipoFactura
    - cliente: Cliente
    - lineas: Lista<LineaFactura>
    + Factura(numero: Entero, tipo: TipoFactura, cliente: Cliente)
        this.numero = numero
        this.tipo = tipo
        this.cliente = cliente       // asociación: llega desde afuera
        lineas = nueva Lista<LineaFactura>()
    FinMetodo
    + agregarLinea(p: Producto, cantidad: Entero): void
        // composición: la parte se crea dentro del todo
        lineas.agregar(nueva LineaFactura(p, cantidad))
    FinMetodo
    + calcularTotal(): Real
        total: Real = 0
        Para cada l en lineas
            total = total + l.subtotal()
        FinPara
        Retornar total
    FinMetodo
    + imprimir(): void
        Mostrar numero, tipo, cliente y calcularTotal()
    FinMetodo
FinClase`,
 r:[`Comprobante es clase abstracta con imprimir() abstracto, y Factura HeredaDe Comprobante e implementa imprimir().`,`Factura guarda cliente: Cliente, recibido desde afuera (asociación a 1).`,`Factura guarda lineas: Lista<LineaFactura> y las crea en agregarLinea (composición).`,`LineaFactura guarda producto: Producto, y Producto no conoce a las líneas.`,`calcularTotal suma los subtotal() y subtotal = cantidad × precioUnitario.`,`TipoFactura es Enum y fechaEmision es protegido (#).`],f:'U4.1 · Relaciones entre clases'},
{id:'U03',open:'uml',t:'uml',s:'C',x:'Clase 11/06',d:'state',q:`Un pedido pasa por RECIBIDO → EN PREPARACIÓN → LISTO → ENTREGADO, y puede cancelarse desde RECIBIDO o EN PREPARACIÓN. Un pedido listo no puede cancelarse; uno entregado o cancelado no puede avanzar ni cancelarse. Escriba el pseudocódigo de Pedido, de la interfaz y de los cinco estados.`,
 m:`Interfaz EstadoPedido
    + avanzar(p: Pedido): void
    + cancelar(p: Pedido): void
    + nombre(): String
FinInterfaz

Clase Pedido
    - id: Entero
    - estado: EstadoPedido
    + Pedido(id: Entero)
        this.id = id
        estado = nuevo Recibido()
    FinMetodo
    + avanzar(): void
        estado.avanzar(this)
    FinMetodo
    + cancelar(): void
        estado.cancelar(this)
    FinMetodo
    + obtenerEstado(): String
        Retornar estado.nombre()
    FinMetodo
    + setEstado(nuevo: EstadoPedido): void
        estado = nuevo
    FinMetodo
FinClase

Clase Recibido Implementa EstadoPedido
    + avanzar(p: Pedido): void
        p.setEstado(nuevo EnPreparacion())
    FinMetodo
    + cancelar(p: Pedido): void
        p.setEstado(nuevo Cancelado())
    FinMetodo
    + nombre(): String
        Retornar "RECIBIDO"
    FinMetodo
FinClase

Clase EnPreparacion Implementa EstadoPedido
    + avanzar(p: Pedido): void
        p.setEstado(nuevo Listo())
    FinMetodo
    + cancelar(p: Pedido): void
        p.setEstado(nuevo Cancelado())
    FinMetodo
    + nombre(): String
        Retornar "EN_PREPARACION"
    FinMetodo
FinClase

Clase Listo Implementa EstadoPedido
    + avanzar(p: Pedido): void
        p.setEstado(nuevo Entregado())
    FinMetodo
    + cancelar(p: Pedido): void
        Mostrar "Un pedido listo no puede cancelarse"
    FinMetodo
    + nombre(): String
        Retornar "LISTO"
    FinMetodo
FinClase

Clase Entregado Implementa EstadoPedido
    + avanzar(p: Pedido): void
        Mostrar "El pedido ya fue entregado"
    FinMetodo
    + cancelar(p: Pedido): void
        Mostrar "Un pedido entregado no puede cancelarse"
    FinMetodo
    + nombre(): String
        Retornar "ENTREGADO"
    FinMetodo
FinClase

Clase Cancelado Implementa EstadoPedido
    + avanzar(p: Pedido): void
        Mostrar "El pedido está cancelado"
    FinMetodo
    + cancelar(p: Pedido): void
        Mostrar "El pedido ya está cancelado"
    FinMetodo
    + nombre(): String
        Retornar "CANCELADO"
    FinMetodo
FinClase`,
 r:[`Pedido guarda estado: EstadoPedido (la interfaz, no un String) y empieza en Recibido.`,`avanzar() y cancelar() de Pedido delegan en el estado pasando this, sin if/else.`,`Los cinco estados Implementan EstadoPedido.`,`Las transiciones válidas usan setEstado: Recibido → EnPreparacion → Listo → Entregado, y a Cancelado desde Recibido y EnPreparacion.`,`Las operaciones inválidas rechazan la solicitud sin cambiar el estado.`,`obtenerEstado() devuelve estado.nombre().`],f:'U5.1 · State · Clase 11/06'},
{id:'U04',open:'uml',t:'uml',s:'C',x:'Clase práctica 12/06',d:'factorymethod',q:`Una plataforma de e-commerce procesa pagos con tarjeta de crédito o PayPal. Cada medio procesa el pago a su manera, pero el flujo del checkout (validar el monto, procesar el pago y confirmar) es siempre el mismo. Escriba el pseudocódigo del diagrama, incluido el cuerpo de realizarCheckout y de los métodos fábrica.`,
 m:`Interfaz MetodoPago
    + procesarPago(monto: Real): void
FinInterfaz

Clase TarjetaCredito Implementa MetodoPago
    + procesarPago(monto: Real): void
        // lógica propia de la tarjeta
    FinMetodo
FinClase

Clase PayPal Implementa MetodoPago
    + procesarPago(monto: Real): void
        // lógica propia de PayPal
    FinMetodo
FinClase

Clase abstracta CheckoutCreator
    + realizarCheckout(monto: Real): void
        Si monto <= 0 Entonces
            Mostrar "Monto inválido"
            Retornar
        FinSi
        pago: MetodoPago = crearMetodoPago()   // dependencia «usa»
        pago.procesarPago(monto)
        Mostrar "Pago confirmado"
    FinMetodo
    + crearMetodoPago(): MetodoPago {abstracto}   // método fábrica
FinClase

Clase CheckoutTarjeta HeredaDe CheckoutCreator
    + crearMetodoPago(): MetodoPago
        Retornar nueva TarjetaCredito()
    FinMetodo
FinClase

Clase CheckoutPayPal HeredaDe CheckoutCreator
    + crearMetodoPago(): MetodoPago
        Retornar nuevo PayPal()
    FinMetodo
FinClase

// Uso
checkout: CheckoutCreator = nuevo CheckoutPayPal()
checkout.realizarCheckout(1500)`,
 r:[`CheckoutCreator es abstracta y crearMetodoPago() es abstracto: es el método fábrica.`,`realizarCheckout tiene el flujo común (validar, crear con crearMetodoPago(), procesar, confirmar) y no nombra clases concretas.`,`CheckoutTarjeta y CheckoutPayPal HeredaDe CheckoutCreator y cada una devuelve su producto.`,`MetodoPago es Interfaz y TarjetaCredito y PayPal la Implementan.`,`El método fábrica devuelve MetodoPago (la abstracción).`,`MetodoPago se usa como variable local, no como atributo (dependencia «usa»).`],f:'Clase práctica 12/06 · Factory Method'},
{id:'U05',open:'uml',t:'uml',s:'C',x:'Clase práctica 12/06',d:'adapter',q:`La aplicación usa su propia interfaz Logger en todo el código. Se quiere incorporar una librería de logging externa, que no se puede modificar, cuyo método es writing(level, text). Escriba el pseudocódigo del diagrama, incluido el cuerpo de registrar del adaptador y el armado de la aplicación.`,
 m:`Interfaz Logger
    + registrar(mensaje: String): void
FinInterfaz

// Clase de la librería externa: no se modifica.
Clase LibreriaLoggerExterna
    + writing(level: String, text: String): void
FinClase

Clase LoggerAdapter Implementa Logger
    - externo: LibreriaLoggerExterna
    + LoggerAdapter(externo: LibreriaLoggerExterna)
        this.externo = externo
    FinMetodo
    + registrar(mensaje: String): void
        externo.writing("INFO", mensaje)   // traduce la llamada
    FinMetodo
FinClase

Clase Aplicacion
    - logger: Logger
    + Aplicacion(logger: Logger)
        this.logger = logger
    FinMetodo
    + procesar(): void
        logger.registrar("Procesando...")
    FinMetodo
FinClase

// Armado
app: Aplicacion = nueva Aplicacion(nuevo LoggerAdapter(nueva LibreriaLoggerExterna()))
app.procesar()`,
 r:[`LoggerAdapter Implementa Logger.`,`LoggerAdapter guarda externo: LibreriaLoggerExterna, recibido por constructor (envuelve al servicio).`,`registrar(mensaje) traduce la llamada a externo.writing(nivel, mensaje).`,`Aplicacion solo conoce Logger (atributo del tipo de la interfaz).`,`LibreriaLoggerExterna no se modifica ni implementa Logger.`],f:'Clase práctica 12/06 · Adapter'},
{id:'U06',open:'uml',t:'uml',s:'C',x:'Clase práctica 12/06 (reducido)',d:'abstractfactory',q:`Una plataforma de streaming renderiza su interfaz en Smart TV y en móvil. Los componentes de un mismo dispositivo deben ser coherentes: no se puede mezclar un reproductor de móvil con un menú de Smart TV. Escriba el pseudocódigo de todas las clases y el armado de la aplicación para Smart TV.`,
 m:`Interfaz ReproductorVideo
    + reproducir(): void
FinInterfaz

Interfaz MenuNavegacion
    + navegar(): void
FinInterfaz

Clase ReproductorSmartTV Implementa ReproductorVideo
    + reproducir(): void      // optimizado para pantalla completa
    FinMetodo
FinClase

Clase ReproductorMovil Implementa ReproductorVideo
    + reproducir(): void      // adaptado a pantallas chicas
    FinMetodo
FinClase

Clase MenuSmartTV Implementa MenuNavegacion
    + navegar(): void         // flechas del control remoto
    FinMetodo
FinClase

Clase MenuMovil Implementa MenuNavegacion
    + navegar(): void         // táctil
    FinMetodo
FinClase

Interfaz DispositivoFactory
    + crearReproductor(): ReproductorVideo
    + crearMenu(): MenuNavegacion
FinInterfaz

Clase SmartTVFactory Implementa DispositivoFactory
    + crearReproductor(): ReproductorVideo
        Retornar nuevo ReproductorSmartTV()
    FinMetodo
    + crearMenu(): MenuNavegacion
        Retornar nuevo MenuSmartTV()
    FinMetodo
FinClase

Clase MovilFactory Implementa DispositivoFactory
    + crearReproductor(): ReproductorVideo
        Retornar nuevo ReproductorMovil()
    FinMetodo
    + crearMenu(): MenuNavegacion
        Retornar nuevo MenuMovil()
    FinMetodo
FinClase

Clase Aplicacion
    - reproductor: ReproductorVideo
    - menu: MenuNavegacion
    + Aplicacion(f: DispositivoFactory)   // «usa»: no la guarda
        reproductor = f.crearReproductor()
        menu = f.crearMenu()
    FinMetodo
    + renderizarUI(): void
        menu.navegar()
        reproductor.reproducir()
    FinMetodo
FinClase

// Armado para Smart TV
app: Aplicacion = nueva Aplicacion(nueva SmartTVFactory())
app.renderizarUI()`,
 r:[`DispositivoFactory es Interfaz con un método de creación por producto, que devuelve el producto abstracto.`,`Cada fábrica concreta crea solo los productos de su familia.`,`Los productos concretos Implementan su interfaz de producto.`,`Aplicacion recibe la fábrica por constructor y no la guarda como atributo; sí guarda reproductor y menu.`,`Aplicacion no nombra clases concretas: la fábrica se elige en el armado.`],f:'Clase práctica 12/06 · Abstract Factory'},
{id:'U07',open:'uml',t:'uml',s:'N',d:'daodto',q:`La pantalla de consulta de libros muestra título, autor y precio de venta. No debe exponerse el precio de costo. Escriba el pseudocódigo del diagrama, incluido el cuerpo de consultarLibro.`,
 m:`// Entidad de dominio
Clase Libro
    - isbn: String
    - titulo: String
    - autor: String
    - precioCosto: Real
    - precioVenta: Real
    + getTitulo(): String
    + getAutor(): String
    + getPrecioVenta(): Real
FinClase

// DTO: solo datos, sin lógica ni acceso a la BD
Clase LibroDTO
    - titulo: String
    - autor: String
    - precio: Real
    + LibroDTO(titulo: String, autor: String, precio: Real)
    + getters
FinClase

Interfaz LibroDAO
    + buscarPorIsbn(isbn: String): Libro
    + guardar(libro: Libro): void
    + eliminar(isbn: String): void
FinInterfaz

Clase LibroDAOMySQL Implementa LibroDAO
    // cada método arma y ejecuta su consulta SQL
FinClase

Clase LibroDAOFake Implementa LibroDAO
    - libros: Mapa<String, Libro>   // datos en memoria para pruebas
FinClase

Clase GestorLibro
    - dao: LibroDAO
    + GestorLibro(dao: LibroDAO)
        this.dao = dao
    FinMetodo
    + consultarLibro(isbn: String): LibroDTO
        libro: Libro = dao.buscarPorIsbn(isbn)
        Si libro = nulo Entonces
            Retornar nulo
        FinSi
        Retornar nuevo LibroDTO(libro.getTitulo(), libro.getAutor(), libro.getPrecioVenta())
    FinMetodo
FinClase`,
 r:[`LibroDAO es Interfaz con operaciones CRUD que trabajan con la entidad Libro.`,`LibroDAOMySQL y LibroDAOFake Implementan LibroDAO.`,`GestorLibro guarda dao: LibroDAO recibido por constructor, sin instanciar una clase concreta (DIP).`,`El gestor, no el DAO, arma el LibroDTO a partir de la entidad.`,`LibroDTO solo tiene datos y no incluye precioCosto.`],f:'U5 · Práctica DAO y DTO'},
{id:'U08',open:'uml',t:'uml',s:'N',d:'strategy',q:`El costo de envío depende del medio: terrestre ($100 por kg + $10 por km), aéreo ($300 por kg + $25 por km) o retiro en sucursal (sin costo). El medio puede cambiarse en tiempo de ejecución. Escriba el pseudocódigo del diagrama con el cuerpo de todos los métodos y un ejemplo de uso.`,
 m:`Interfaz EstrategiaEnvio
    + costo(peso: Real, km: Real): Real
FinInterfaz

Clase EnvioTerrestre Implementa EstrategiaEnvio
    + costo(peso: Real, km: Real): Real
        Retornar 100 * peso + 10 * km
    FinMetodo
FinClase

Clase EnvioAereo Implementa EstrategiaEnvio
    + costo(peso: Real, km: Real): Real
        Retornar 300 * peso + 25 * km
    FinMetodo
FinClase

Clase RetiroSucursal Implementa EstrategiaEnvio
    + costo(peso: Real, km: Real): Real
        Retornar 0
    FinMetodo
FinClase

Clase CalculadoraEnvio
    - estrategia: EstrategiaEnvio
    + setEstrategia(e: EstrategiaEnvio): void
        estrategia = e
    FinMetodo
    + calcular(peso: Real, km: Real): Real
        Retornar estrategia.costo(peso, km)
    FinMetodo
FinClase

// Uso
calc: CalculadoraEnvio = nueva CalculadoraEnvio()
calc.setEstrategia(nuevo EnvioTerrestre())
calc.calcular(2, 50)            // 700
calc.setEstrategia(nuevo EnvioAereo())
calc.calcular(2, 50)            // 1850`,
 r:[`EstrategiaEnvio es Interfaz y las tres estrategias la Implementan con su fórmula.`,`CalculadoraEnvio guarda estrategia: EstrategiaEnvio (la interfaz).`,`setEstrategia permite cambiarla en tiempo de ejecución.`,`calcular delega en estrategia.costo(peso, km), sin if/else por medio.`,`Las fórmulas son correctas y hay un ejemplo de uso.`],f:'Patrones de Diseño (Gamma) · Strategy'},
{id:'U09',open:'uml',t:'uml',s:'N',d:'observer',q:`Cuando un envío cambia de estado, hay que avisar a todos los interesados por email o SMS, sin que Envio dependa de cada canal. Escriba el pseudocódigo del diagrama, con el cuerpo de suscribir, desuscribir, cambiarEstado, notificar y actualizar.`,
 m:`Interfaz Observador
    + actualizar(e: Envio): void
FinInterfaz

Clase Envio
    - codigo: String
    - estado: String
    - observadores: Lista<Observador>
    + Envio(codigo: String)
        this.codigo = codigo
        observadores = nueva Lista<Observador>()
    FinMetodo
    + suscribir(o: Observador): void
        observadores.agregar(o)       // agregación: llega desde afuera
    FinMetodo
    + desuscribir(o: Observador): void
        observadores.quitar(o)
    FinMetodo
    + cambiarEstado(nuevo: String): void
        estado = nuevo
        notificar()
    FinMetodo
    - notificar(): void
        Para cada o en observadores
            o.actualizar(this)
        FinPara
    FinMetodo
    + getEstado(): String
        Retornar estado
    FinMetodo
FinClase

    FinMetodo

const KEY='p2mc.v1',SESSION='p2mc.session.v1',PASS=60;
/* Minutos y peso en la nota de cada tipo de pregunta. */
const MIN={mc:1.5,dev:6,uml:15},WEIGHT={mc:1,dev:3,uml:6};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const kind=q=>q.open||'mc';
const byId=Object.fromEntries([...BANK,...OPEN].map(q=>[q.id,q]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let store=load(KEY,{seen:{},wrong:{}});
let cfg={mode:'exam',n:18,dev:2,uml:1,timed:true,origOnly:false,topics:Object.keys(TOPIC)};
let S=null,tmr=null;

function scoreQ(q,ans){
  const chosen=new Set(ans||[]);if(!chosen.size)return 0;
  const ok=new Set(q.a);let r=0,w=0;chosen.forEach(v=>ok.has(v)?r++:w++);
  return Math.max(0,Math.min(1,(r-w)/ok.size));
}
/* Las abiertas se puntúan con los criterios que marca el alumno al compararse con el modelo. */
function scoreAt(i){
  const q=qOf(i);
  if(!q.open)return scoreQ(q,S.ans[i]);
  return answered(i)?S.marks[i].length/q.r.length:0;

  h+=`</div><div class="row" style="margin-bottom:14px"><button class="b" data-act="start" ${count?'':'disabled'}>Empezar (${count})</button><button class="b s" data-act="review" ${wrong.length?'':'disabled'}>Repasar falladas (${wrong.length})</button></div>`;
  if(!count)h+='<p class="warn">No hay preguntas con esa selección.</p>';
  h+=`<div class="card"><details><summary>Cómo se corrigen las preguntas abiertas</summary><p style="margin-top:8px">Escribís tu respuesta como en el parcial. Después ves la respuesta modelo y una lista de criterios: marcás los que tu respuesta cumple, y ese porcentaje es tu puntaje. En el simulacro esto se hace al finalizar; en práctica, con el botón <i>Ver respuesta modelo</i>.</p><p>La nota se pondera: cada multiple choice vale ${WEIGHT.mc}, cada desarrollo ${WEIGHT.dev} y cada diagrama ${WEIGHT.uml}. Una abierta vuelve a <i>Repasar falladas</i> si cumple menos del 60 % de los criterios.</p><p>Las respuestas modelo salen de los resúmenes, del Parcial 1 de 2026 y de las clases prácticas, pero no las revisó la cátedra.</p></details></div>`;
  h+=`<div class="card"><details><summary>Qué quedó afuera del banco</summary><p style="margin-top:8px">Estos temas no tienen preguntas, porque no figuran en el programa (Contenido Parcial 2.png) o solo se nombran en las presentaciones:</p><ul><li>Administración de la Configuración: líneas base e ítems de configuración.</li><li>Tipos de mantenimiento y rejuvenecimiento del software.</li><li>Diagrama de actividad: nodo final de flujo y de actividad.</li><li>Los demás patrones del catálogo, que solo aparecen nombrados.</li></ul><p style="margin-top:8px">Strategy, Observer, Factory Method, Abstract Factory y Adapter también aparecen solo nombrados, pero se incluyeron como un tema aparte. Sus respuestas salen del libro <i>Patrones de Diseño</i>, no de los apuntes.</p></details>${seen?'<p style="margin:10px 0 0"><button class="link" data-act="wipe">Borrar mi progreso</button></p>':''}</div>`;
  $('#app').innerHTML=h;
}
/* ---------- Eventos ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b){return}
  const d=b.dataset;
  if(d.opt!==undefined)return choose(+d.opt);
  if(d.go!==undefined)return go(+d.go);
  if(d.mode){cfg.mode=d.mode;return home()}
  if(d.n!==undefined){cfg.n=+d.n;return home()}
  if(d.dev!==undefined){cfg.dev=+d.dev;return home()}
  if(d.uml!==undefined){cfg.uml=+d.uml;return home()}
  if(d.crit!==undefined){toggleCrit(+d.q,+d.crit);S.done?results():render();const e=document.querySelector(`[data-q="${d.q}"][data-crit="${d.crit}"]`);if(e)e.focus({preventScroll:true});return}
  if(d.topic){cfg.topics=cfg.topics.includes(d.topic)?cfg.topics.filter(t=>t!==d.topic):[...cfg.topics,d.topic];return home()}
  if(d.all!==undefined){cfg.topics=d.all==='1'?Object.keys(TOPIC):[];return home()}
  if(d.unit!==undefined){const ks=UNITS[+d.unit].t.map(x=>x[0]),on=ks.every(k=>cfg.topics.includes(k));cfg.topics=on?cfg.topics.filter(t=>!ks.includes(t)):[...new Set([...cfg.topics,...ks])];return home()}
  if(d.filter){S.filter=d.filter;return results()}
  switch(d.act){
    case'start':return begin(pick({...cfg,n:cfg.n>=9999?poolFor(cfg).length:cfg.n}),cfg.mode,cfg.mode==='exam'&&cfg.timed);
    case'review':return begin(shuffle(Object.keys(store.wrong).filter(id=>byId[id]).map(id=>byId[id])),'practice',false);
    case'resume':S=load(SESSION,null);S.marks=S.marks||S.ids.map(()=>[]);runTimer();if(!S.done)render();return;
    case'discard':S=null;persist();return home();
    case'wipe':if(confirm('¿Borrar las preguntas vistas y falladas?')){store={seen:{},wrong:{}};save(KEY,store);home()}return;
    case'prev':return go(S.i-1);
    case'next':return go(S.i+1);
    case'verify':return verify();
    case'nextun':return go(nextUnchecked());
    case'finish':return finish();
    case'retry':{const ids=S.ids.filter((id,i)=>!passed(byId[id],scoreAt(i))).map(id=>byId[id]);S=null;persist();return begin(shuffle(ids),'practice',false)}
    case'home':S=null;persist();runTimer();return home();
  }
});
document.addEventListener('input',ev=>{if(ev.target.dataset.txt!==undefined&&S)typeAnswer(ev.target.value)});
/* Tab inserta sangría en el pseudocódigo en lugar de salir del campo. */
document.addEventListener('keydown',ev=>{
  const t=ev.target;if(ev.key!=='Tab'||ev.shiftKey||!t.classList||!t.classList.contains('code')||t.readOnly)return;
  ev.preventDefault();t.setRangeText('    ',t.selectionStart,t.selectionEnd,'end');typeAnswer(t.value);
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='timed'){cfg.timed=ev.target.checked;home()}
  if(ev.target.id==='orig'){cfg.origOnly=ev.target.checked;home()}
});
$('#exit').addEventListener('click',()=>{
  if(!S||S.done)return;
  if(confirm('¿Salir al inicio? El intento queda guardado y podés continuarlo después.')){persist();clearInterval(tmr);S=null;runTimer();home()}
});
document.addEventListener('keydown',ev=>{
  if(!S||S.done||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  const tgt=ev.target.tagName;
  if(tgt==='TEXTAREA'||tgt==='INPUT')return;
  if(ev.key==='ArrowLeft')return go(S.i-1);
  if(ev.key==='ArrowRight')return go(S.i+1);
  if(ev.key==='Enter'){
    /* Enter sobre una opción ya marcada avanza; sobre otros botones, los activa. */
    if(tgt==='BUTTON'&&!(ev.target.dataset.opt!==undefined&&answered(S.i)))return;
    ev.preventDefault();
    if(S.mode==='practice'){if(S.checked[S.i]){const k=nextUnchecked();k>=0?go(k):finish()}else verify()}
    else if(S.i<S.ids.length-1)go(S.i+1);
    return;
  }
  const pos=ev.key.toLowerCase().charCodeAt(0)-97;
  if(ev.key.length===1&&pos>=0&&pos<S.ord[S.i].length)choose(S.ord[S.i][pos]);
});
tick();home();
</script>
