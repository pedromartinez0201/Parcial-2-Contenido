<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador · Parcial 2 · Diseño de Sistemas</title>
<style>
:root{--bg:#0D1B2A;--card:#112240;--inset:#0A1628;--bd:#1E3A5F;--bd2:#334155;--ac:#00AEEF;--tx:#CBD5E1;--hi:#F1F5F9;--mut:#94A3B8;--ok:#10B981;--okbg:#022C22;--bad:#F87171;--badbg:#2A1014;--warn:#F59E0B}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:9;background:linear-gradient(135deg,#001933,#0055A4);border-bottom:2px solid var(--ac);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header b{color:#fff;display:block;line-height:1.25}header small{color:#93C5FD}
.hbar{display:flex;align-items:center;gap:10px}
#timer{font:600 18px ui-monospace,monospace;padding:4px 12px;border:1px solid var(--bd);border-radius:6px;background:#001933;color:var(--ac);font-variant-numeric:tabular-nums}
#timer.low{color:var(--bad);border-color:var(--bad)}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
h1{color:#fff;font-size:21px;margin:0 0 4px}
h2{color:#fff;font-size:17px;line-height:1.45;margin:0 0 10px;font-weight:650}
h3{color:var(--hi);font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px}
p{margin:0 0 8px}
.muted{color:var(--mut);font-size:13px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b{background:var(--ac);color:#001933;border:1px solid var(--ac);border-radius:8px;padding:9px 18px;font-weight:700}
.b.s{background:transparent;color:var(--ac)}
.b:disabled{opacity:.4;cursor:not-allowed}
.b.small{padding:5px 12px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--bd2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--inset);color:var(--tx);border:0;padding:8px 14px;min-width:64px}
.seg button+button{border-left:1px solid var(--bd2)}
.seg button[aria-pressed=true]{background:var(--ac);color:#001933;font-weight:700}
.field{margin-bottom:14px}
.field>label,.field>.lab{display:block;font-size:13px;font-weight:600;color:var(--hi);margin-bottom:6px}
.unit{margin-bottom:12px}
.unit .row{margin-bottom:6px}
.unit b{color:var(--hi);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--inset);border:1px solid var(--bd2);color:var(--mut);border-radius:99px;padding:5px 12px;font-size:13px}
.chip[aria-pressed=true]{border-color:var(--ac);color:var(--hi);background:#0F2744}
.chip span{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--ac);padding:0;font-size:12px;text-decoration:underline}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
details{font-size:13px;color:var(--mut)}
details summary{cursor:pointer;color:var(--tx)}
details ul{margin:8px 0 0;padding-left:18px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--bd);border-radius:99px;padding:2px 10px;color:var(--mut);margin:0 4px 8px 0}
.tag.src{border-color:#3975A8;color:#7DD3FC}
.progress{height:7px;background:#071321;border-radius:9px;overflow:hidden;margin:0 0 12px}
.progress>div{height:100%;background:var(--ac);transition:width .2s}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.nav button{width:34px;height:34px;border-radius:7px;border:1px solid var(--bd);background:var(--inset);color:var(--tx);font-weight:700;font-size:13px;padding:0}
.nav button.done{background:#0F2744;border-color:#3975A8}
.nav button.okq{background:#064E3B;border-color:var(--ok)}
.nav button.badq{background:#4C1419;border-color:var(--bad)}
.nav button.cur{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--inset);border:1px solid var(--bd2);border-radius:8px;padding:10px 14px;color:var(--tx);margin-bottom:8px;font-size:14.5px}
button.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default;opacity:1}
.opt .mk{flex:none;width:18px;height:18px;margin-top:2px;border:2px solid var(--mut);display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1;color:#001933}
.opt .mk.radio{border-radius:50%}.opt .mk.box{border-radius:4px}
.opt.sel{border-color:var(--ac);background:#0F2744;box-shadow:0 0 0 1px var(--ac)}
.opt .mk.on{background:var(--ac);border-color:var(--ac)}
.opt.right .mk.on{background:var(--ok);border-color:var(--ok)}
.opt.wrong .mk.on{background:var(--bad);border-color:var(--bad)}
.opt b{color:var(--hi);flex:none}
.opt .txt{flex:1}
.opt.right{border-color:var(--ok);background:var(--okbg);box-shadow:none}
.opt.wrong{border-color:var(--bad);background:var(--badbg);box-shadow:none}
.opt .why{display:block;font-size:12px;font-weight:700;margin-top:2px}
.opt.right .why{color:#34D399}.opt.wrong .why{color:var(--bad)}
.stmts{list-style:none;margin:0 0 12px;padding:10px 14px;background:var(--inset);border:1px solid var(--bd);border-radius:8px;font-size:14.5px}
.stmts li{margin:3px 0}
pre{background:#060F1A;border:1px solid var(--bd);border-radius:8px;padding:12px;overflow-x:auto;font:13px/1.55 ui-monospace,monospace;color:#94E5A1;margin:0 0 12px}
.hint{background:#0C1A2E;border:1px solid #3B82F6;border-radius:8px;padding:12px 14px;color:#BFDBFE;margin-top:6px;font-size:14px}
.hint .f{display:block;color:var(--mut);font-size:12px;margin-top:6px}
.verdict{font-weight:700;margin-top:10px}
.big{font:800 56px/1.1 ui-monospace,monospace}
.stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:12px 0}
.bar{display:grid;grid-template-columns:minmax(120px,240px) 1fr 62px;gap:10px;align-items:center;font-size:13px;margin-bottom:7px}
.bar i{display:block;height:8px;border-radius:9px;background:#071321;overflow:hidden}
.bar i u{display:block;height:100%;text-decoration:none}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.kbd{font-size:12px;color:var(--mut);margin-top:10px}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--bd2);border-radius:4px;padding:0 4px}
.warn{color:var(--warn);font-size:13px}
.navwrap{margin-bottom:12px}.navwrap .nav{margin:8px 0 0}
.tag.open{border-color:#B45309;color:#FCD34D}
.diagram{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px;overflow-x:auto;margin:0 0 12px}
textarea.ans{width:100%;min-height:180px;resize:vertical;background:var(--inset);color:var(--hi);border:1px solid var(--bd2);border-radius:8px;padding:10px 12px;font:14.5px/1.55 Inter,system-ui,sans-serif;margin:0 0 8px}
textarea.ans.code{min-height:360px;font:13.5px/1.55 ui-monospace,monospace;tab-size:4;white-space:pre;overflow-wrap:normal;overflow-x:auto}
textarea.ans:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 1px var(--ac)}
textarea.ans[readonly]{opacity:.85}
pre.model{color:#E2E8F0;white-space:pre-wrap}
pre.code{white-space:pre}
.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.rubric{border:1px solid #B45309;background:#1C1407;border-radius:8px;padding:12px 14px;margin-top:6px}
.rubric p{color:#FCD34D;font-size:13px;margin:0 0 8px}
.crit{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;color:var(--tx);padding:5px 0;font-size:14px}
.crit .mk{flex:none;width:18px;height:18px;margin-top:2px;border:2px solid var(--mut);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#001933}
.crit[aria-checked=true] .mk{background:var(--ok);border-color:var(--ok)}
.crit:disabled{cursor:default;opacity:.6}
.guide pre{margin:8px 0 0}
@media(max-width:600px){header{flex-wrap:nowrap}header small{display:none}main{padding:10px}.card{padding:13px}.big{font-size:44px}.opt{font-size:14px}.bar{grid-template-columns:1fr 62px}.bar i{grid-column:1/3;grid-row:2}}
@media(hover:none){.kbd{display:none}}
</style>
</head>
<body>
<header>
  <div><b>Simulador · Parcial 2</b><small>Diseño de Sistemas de Información · Unidades 4, 5 y 6</small></div>
  <div class="hbar"><span id="timer" hidden></span><button id="exit" class="b s small" hidden>Salir</button></div>
</header>
<main><div id="app"></div></main>
<script>
/* TEMAS: solo lo que figura en el programa oficial (Contenido Parcial 2.png). */
const UNITS=[
 {u:'Unidad 4 · Diagramas UML',t:[['est','Máquinas de estado'],['comp','Componentes, paquetes y subsistemas'],['desp','Diagrama de despliegue'],['sec','Diagrama de secuencia']]},
 {u:'Unidad 5 · Patrones, SOLID y arquitectura',t:[['pat','Patrones: fundamentos'],['ss','State y Singleton'],['fbm','Facade, Bridge y Mediator'],['gof','Strategy, Observer, Factory y Adapter'],['dao','DAO y DTO'],['solid','Principios SOLID'],['arq','Arquitectura de software']]},
 {u:'Unidad 6 · Pruebas e implementación',t:[['pru','Fundamentos de prueba y debugging'],['cn','Caja negra'],['cb','Caja blanca'],['niv','Unidad e integración'],['tip','Funcional, humo, regresión y sistema'],['fin','Aceptación y fin de las pruebas'],['conv','Conversión de programas'],['impl','Datos, procedimientos y capacitación'],['rel','Gestión de liberaciones']]}
];
const TOPIC={...Object.fromEntries(UNITS.flatMap(x=>x.t)),uml:'Diagrama a pseudocódigo'};
const SRC={P:'Parcial modelo',S:'Adaptada del simulador',N:'Nueva',E:'Examen anterior',C:'Clase práctica'};

/* BANCO. Campos: id, t tema, s origen (P/S/N), q enunciado, l afirmaciones, c código, o opciones,
   a índices correctos, m selección múltiple, k no mezclar opciones, e fundamento, f fuente. */
const BANK=[
/* ---------- Parcial modelo (preguntas-p2.txt): redacción original ---------- */
{id:'P01',t:'pat',s:'P',m:1,q:'¿Cuál/es de las siguientes afirmaciones son correctas acerca del uso de patrones de diseño?',o:['Permiten mejorar la flexibilidad y la mantenibilidad del software.','Los patrones son recetas que deben seguirse al pie de la letra.','Solo pueden aplicarlos programadores avanzados.','Están diseñados para reemplazar cualquier tipo de documentación.','Los patrones de diseño formalizan un lenguaje común entre los diseñadores'],a:[0,4],e:'Dan elementos reusables y formalizan un vocabulario común entre diseñadores. No son de uso obligatorio ni recetas rígidas: en un caso particular pueden no ser aplicables.',f:'U5.1 · ¿Para qué? / Qué no buscan'},
{id:'P03',t:'pru',s:'P',m:1,q:'¿Qué técnicas o herramientas pueden ayudar a realizar el debugging? (Seleccione todas las que correspondan)',o:['Análisis de logs.','Depurador integrado (IDE debugger)','Uso de breakpoints.','Pruebas unitarias.'],a:[0,1,2,3],e:'Los logs aportan evidencia de ejecución; el depurador y los breakpoints permiten inspeccionar el estado; las pruebas unitarias acotan al sospechoso («facilitan el debugging»).',f:'U6.2 · Pruebas de unidad; Myers · Depuración'},
{id:'P04',t:'dao',s:'P',q:'¿Qué consecuencia puede tener un sistema sino se implementa el patrón DAO u otro patrón de persistencia?',o:['Mejor rendimiento en el acceso a la base de datos.','Incremento de la cohesión entre capas.','Fuerte dependencia de la capa de negocio respecto a la capa de acceso a datos.','Disminución del acoplamiento entre componentes.'],a:[2],e:'El DAO existe para bajar el acoplamiento y que la variedad de motores no afecte a la lógica. Sin esa abstracción, el negocio queda atado a los detalles de acceso a datos.',f:'Práctica DAO y DTO'},
{id:'P05',t:'tip',s:'P',m:1,q:'¿Cuáles de los siguientes tipos de pruebas se consideran pruebas no funcionales? (Seleccione todas las que correspondan)',o:['Pruebas de rendimiento.','Pruebas de integración.','Pruebas de stress','Pruebas de unidad.','Pruebas de seguridad.'],a:[0,2,4],e:'Rendimiento, esfuerzo (stress) y seguridad verifican atributos de calidad. Unidad e integración no son «tipos» sino niveles: indican el alcance de la prueba.',f:'U6.2 · Niveles, tipos y técnicas; Pruebas de sistema'},
{id:'P06',t:'sec',s:'P',m:1,q:'En un diagrama de secuencia, ¿cuáles de las siguientes afirmaciones son correctas?',o:['Los mensajes de retorno pueden omitirse si no aportan información relevante al flujo','Un mensaje asíncrono bloquea siempre al emisor hasta recibir respuesta.','Un diagrama de secuencia puede generarse a partir de la ingeniería inversa de código fuente.','Las barras de activación representan períodos durante los cuales un objeto está ejecutando una operación','Un mensaje síncrono implica que el emisor espera la finalización de la operación antes de continuar.'],a:[0,2,3,4],e:'En el mensaje asíncrono el emisor sigue sin esperar; el que espera es el síncrono. Lo demás es correcto.',f:'Práctica 11/09/26 · Secuencia'},
{id:'P07',t:'tip',s:'P',q:'Luego de terminar todas las funcionalidades, un equipo de QA valida que el sistema completo cumpla con los requisitos especificados. Este proceso corresponde a:',o:['Pruebas de sistema.','Pruebas de integración.','Pruebas unitarias.','Pruebas de regresión.'],a:[0],e:'La prueba de sistema toma el sistema completo y lo compara con sus objetivos, incluyendo requisitos funcionales y no funcionales.',f:'U6.2 · Pruebas de sistema'},
{id:'P08',t:'dao',s:'P',q:'En una arquitectura con DAO y Factory, ¿qué sucede si se quiere agregar soporte para una nueva base de datos?',o:['No es posible agregar nuevas bases de datos sin reescribir toda la capa de acceso a datos.','Es necesario modificar la lógica de negocio para aceptar el nuevo tipo de conexión','Solo se implementan los nuevos DAOs y una nueva Factory que los provea.','Se deben modificar todas las clases DAO existentes.'],a:[2],e:'Como el negocio depende de la interfaz DAO, una tecnología nueva se incorpora con implementaciones nuevas y sin tocar lo existente.',f:'Práctica DAO y DTO · ¿Por qué interfaz?'},
{id:'P09',t:'conv',s:'P',q:'Un hospital está incorporando un nuevo módulo digital para el área de emergencias. Sin embargo, el área de facturación seguirá con el sistema anterior en una primer etapa. El objetivo es que el personal se acostumbre progresivamente al nuevo sistema, mientras el resto del sistema sigue funcionando. ¿Qué tipo de implementación sería la más apropiada?',o:['Total','Por prototipado','Paralela','Gradual'],a:[3],e:'En la conversión gradual los componentes nuevos sustituyen a los viejos de a uno y los usuarios se adaptan de a poco.',f:'U6.3 · Conversión gradual (diap. 6)'},
{id:'P10',t:'arq',s:'P',k:1,q:'En una institución educativa que usa un aplicativo Web, se detecta que los usuarios experimentan lentitud en horas pico. Se evalúan distintas soluciones para mejorar el rendimiento del sistema. ¿Cuáles de estas medidas representan escalabilidad horizontal?',l:['(a) Migrar el servidor a una máquina con más CPU y memoria.','(b) Instalar varios servidores web y usar un balanceador de carga.','(c) Replicar la base de datos para distribuir lecturas.','(d) Optimizar la interfaz visual reduciendo imágenes.'],o:['Solo la b y c','Solo la a y c','Solo la a y d','Solo la b'],a:[0],e:'Horizontal es sumar nodos que reparten el trabajo: (b) y (c). Más CPU y RAM es vertical; reducir imágenes es una optimización, no escalamiento.',f:'U5.5 · Escalabilidad'},
{id:'P12',t:'solid',s:'P',m:1,q:'¿Qué principio/s SOLID favorecen una alta cohesión?',o:['Principio de abierto/cerrado.','Principio de segregación de interfaces.','Principio de sustitución de Liskov.','Principio de responsabilidad única.'],a:[1,3],e:'El apunte relaciona SRP directamente con la cohesión y lista «alta cohesión, menor acoplamiento» como ventaja de ISP.',f:'U5.4 · SRP e ISP'},
{id:'P13',t:'conv',s:'P',q:'Una empresa multinacional desea reemplazar su sistema de gestión de recursos humanos. El sistema actual funciona bien pero es obsoleto, y es vital que el nuevo sistema no interrumpa la operación diaria. Se debe garantizar que el nuevo sistema liquide los sueldos sin errores. El sistema es muy complejo y afecta a más de 5 áreas organizacionales. ¿Qué tipo de implementación sería la más apropiada?',o:['Por prototipado','Total','Paralela','Gradual'],a:[2],e:'Si un error es inaceptable (sueldos), conviene la conversión en paralelo: el viejo sigue disponible y se comparan resultados hasta confiar en el nuevo.',f:'U6.3 · Conversión en paralelo (diap. 5 y 10)'},
{id:'P16',t:'arq',s:'P',m:1,q:'¿Cuál de las siguientes afirmaciones describe qué es una arquitectura de software?',o:['El conjunto de decisiones técnicas que definen cómo se organiza y comunica el sistema internamente.','El cronograma de desarrollo y las tareas asignadas al equipo durante el proyecto','El resultado de las decisiones de diseño que impactan en atributos como rendimiento, seguridad y mantenibilidad.','La estructura fundamental de un sistema, que define sus componentes, sus relaciones y los principios que guían su evolución.','El diseño gráfico de la interfaz de usuario, incluyendo colores, tipografía y disposición visual.'],a:[0,2,3],e:'La arquitectura abarca estructura, características, decisiones y principios de diseño. No es un cronograma ni el diseño visual de la interfaz.',f:'U5.5 · Arquitectura; Richards y Ford cap. 1'},

/* ---------- U4 · Máquinas de estado ---------- */
{id:'E01',t:'est',s:'S',m:1,q:'En un diagrama de estados, ¿cuáles afirmaciones son correctas?',o:['Siempre hay un estado inicial.','Puede haber varios estados finales, o ninguno.','La guarda se evalúa cuando ocurre el evento de la transición.','Una acción de transición puede ser interrumpida por otro evento.'],a:[0,1,2],e:'La acción de una transición es atómica: ningún evento la interrumpe.',f:'U4.3 · Estado inicial y final; Acciones'},
{id:'E02',t:'est',s:'N',q:'Un diagrama de estados modela:',o:['La vista de un único objeto que detecta eventos y responde a ellos.','La interacción entre varios objetos a lo largo del tiempo.','La distribución de los artefactos en los nodos de procesamiento.','La estructura estática de las clases y de sus asociaciones.'],a:[0],e:'Cada objeto se trata como una entidad aislada que se comunica con el resto detectando eventos. La interacción entre varios objetos corresponde al diagrama de secuencia.',f:'U4.3 · Diagrama de estados'},
{id:'E03',t:'est',s:'N',m:1,q:'Un estado es una condición o situación durante la vida de un objeto en la cual este: (Seleccione todas las que correspondan)',o:['Satisface alguna condición.','Está realizando alguna actividad.','Está esperando algún evento.','Cambia de clase de forma instantánea.'],a:[0,1,2],e:'Son las tres situaciones de la definición. «Parece cambiar de clase» es la intención del patrón State, no la definición de estado.',f:'U4.3 · ¿Qué es una máquina de estados?'},
{id:'E04',t:'est',s:'N',q:'Una transición λ (lambda) se caracteriza porque:',o:['No requiere un evento: se produce automáticamente al desaparecer la condición que identifica al estado.','Requiere siempre una condición de guarda explícita que se evalúa al entrar al estado siguiente.','Vuelve siempre al mismo estado de origen y no ejecuta ninguna acción de entrada ni de salida.','Solo puede partir del estado inicial de la máquina, antes de que el objeto reciba algún evento.'],a:[0],e:'La transición λ no necesita la ocurrencia de un evento para habilitarse.',f:'U4.3 · Transición y transición λ'},
{id:'E05',t:'est',s:'N',q:'En la etiqueta de transición de un cajero, ¿qué es cada parte?',c:'retirar(monto) [monto <= saldo] / debitar(monto)',o:['Evento: retirar(monto). Guarda: [monto <= saldo]. Acción: debitar(monto).','Acción: retirar(monto). Evento: [monto <= saldo]. Guarda: debitar(monto).','Evento: debitar(monto). Guarda: [monto <= saldo]. Acción: retirar(monto).','Guarda: retirar(monto). Acción: [monto <= saldo]. Evento: debitar(monto).'],a:[0],e:'La notación es evento [condición] / acción.',f:'U4.3 · Una transición tiene cinco partes'},
{id:'E06',t:'est',s:'N',q:'Una transición tiene la guarda [monto <= saldo]. Ocurre el evento y la guarda resulta falsa. ¿Qué sucede?',o:['La transición no se dispara y el objeto sigue en el estado actual.','La transición se dispara, pero sin ejecutar la acción asociada.','El evento se encola y se reintenta hasta que la guarda sea verdadera.','El objeto pasa al estado final porque la máquina quedó indeterminada.'],a:[0],e:'Para dispararse deben ocurrir el evento y la condición debe ser verdadera. Encolar es lo que hace un evento diferido, que se declara aparte.',f:'U4.3 · Condición de guarda'},
{id:'E07',t:'est',s:'N',q:'Un evento diferido en un estado es aquel que:',o:['No se procesa en ese estado, pero no se pierde: se encola y se atiende en un estado posterior.','Se ejecuta recién cuando expira un temporizador asociado a la transición de salida del estado.','Se descarta porque el estado actual no tiene ninguna transición de salida para atenderlo.','Se procesa de inmediato en el estado actual, sin causar ningún cambio de estado en el objeto.'],a:[0],e:'Se pospone y se añade a una cola para manejarlo en otro momento. Procesarlo sin cambiar de estado sería una transición interna.',f:'U4.3 · Partes de un estado; Eventos diferidos'},
{id:'E08',t:'est',s:'N',q:'Un cajero en mantenimiento vuelve al superestado «Activo», que tiene la notación H. ¿A qué subestado entra?',o:['Al último subestado que había visitado antes de salir.','Al subestado inicial declarado dentro de «Activo».','Al subestado final de «Activo», que dispara su salida.','A todos sus subestados a la vez, en regiones concurrentes.'],a:[0],e:'La H memoriza el último subestado visitado y lo recupera en la transición entrante.',f:'U4.3 · Estados con historia'},
{id:'E09',t:'est',s:'N',q:'Un estado compuesto tiene dos regiones concurrentes. ¿Cuándo se considera completo?',o:['Cuando todas sus regiones llegan a su estado final.','Cuando cualquiera de sus regiones llega a su estado final.','Cuando la primera región declarada llega a su estado final.','Cuando ocurre un evento externo, sin importar sus regiones.'],a:[0],e:'Cada región evoluciona de forma independiente, y el compuesto se completa solo cuando terminan todas.',f:'U4.3 · Subestados concurrentes'},
{id:'E10',t:'est',s:'N',q:'Si un estado compuesto posee un subestado inicial, una transición que llega al superestado es:',o:['Una transición a ese subestado inicial.','Una transición a su último subestado visitado.','Una transición interna, sin cambio de estado.','Una transición λ hacia su subestado final.'],a:[0],e:'Volver al último visitado requiere la notación de historia H.',f:'U4.3 · Máquina de estados: ejemplo'},
{id:'E11',t:'est',s:'N',m:1,q:'¿Cuáles de los siguientes elementos son partes de un estado?',o:['Transiciones internas.','Eventos diferidos.','Líneas de vida.','Subestados.','Barras de activación.'],a:[0,1,3],e:'Las partes son nombre, acciones de entrada/salida, transiciones internas, subestados y eventos diferidos. Líneas de vida y barras de activación son del diagrama de secuencia.',f:'U4.3 · Partes de un estado'},
{id:'E12',t:'est',s:'N',m:1,q:'¿Qué puede constituir un evento en una máquina de estados?',o:['La recepción de una señal (comunicación asincrónica).','La recepción de una llamada (requerimiento sincrónico).','El paso del tiempo.','Un cambio en el estado.','Un fragmento alt.'],a:[0,1,2,3],e:'Un evento es un estímulo que produce la transición: señales, llamadas, paso del tiempo o cambio en el estado. alt es un fragmento del diagrama de secuencia.',f:'U4.3 · Evento'},
{id:'E13',t:'est',s:'N',q:'Hay que registrar un log cada vez que un objeto ingresa a «En revisión», sin importar desde qué estado llega. La opción más adecuada es:',o:['Una acción entry en el estado «En revisión».','Una acción exit en cada uno de los estados de origen.','Una transición interna dentro de «En revisión».','Un evento diferido en el estado «En revisión».'],a:[0],e:'entry se ejecuta al entrar al estado, por cualquier transición. Evita repetir la acción en cada transición entrante.',f:'U4.3 · Acciones en el estado'},
{id:'E14',t:'est',s:'N',q:'El paso de un estado a otro se considera instantáneo porque:',o:['El sistema siempre debe hallarse en un estado conocido.','Las acciones de entrada y salida no consumen tiempo.','Las transiciones siempre carecen de una acción asociada.','Solo puede ocurrir un único evento por cada objeto.'],a:[0],e:'Es la justificación del apunte: no existe un «entre estados».',f:'U4.3 · Transición y transición λ'},
{id:'E15',t:'est',s:'N',q:'¿Qué función cumple la condición de guarda respecto de la máquina de estados?',o:['Permite mantener su aspecto determinístico.','Permite memorizar el último subestado.','Permite ejecutar regiones en paralelo.','Permite posponer eventos para más tarde.'],a:[0],e:'Ante un mismo evento, las guardas deciden qué transición se dispara.',f:'U4.3 · Condición de guarda'},

/* ---------- U4 · Componentes ---------- */
{id:'C01',t:'comp',s:'S',q:'Un subsistema se diferencia de un paquete común en que:',o:['Además de agrupar, exhibe comportamiento accesible a través de interfaces.','Solo puede contener clases y nunca puede contener otros paquetes.','Representa siempre un nodo físico sobre el que se despliega el software.','Sus elementos internos son accesibles desde cualquier clase del sistema.'],a:[0],e:'El comportamiento lo implementan clases y paquetes internos, que no son accesibles desde afuera del subsistema.',f:'U4.2 · Subsistema'},
{id:'C02',t:'comp',s:'N',m:1,q:'¿Cuáles de las siguientes afirmaciones describen a un componente?',o:['Es una parte modular, desplegable y reemplazable del sistema.','Encapsula su implementación y expone un conjunto de interfaces.','Es cohesivo: denota un bloque significativo de un sistema mayor.','Expone sus atributos internos para que otros los usen sin interfaz.','Es el equipo físico donde se ejecuta el software del sistema.'],a:[0,1,2],e:'El componente oculta su implementación tras interfaces. El equipo físico es un nodo, del diagrama de despliegue.',f:'U4.2 · Componentes'},
{id:'C03',t:'comp',s:'N',q:'En CampusCoffee, el componente Pagos ofrece IPago al resto del sistema y usa la API de una pasarela externa. Entonces:',o:['IPago es una interfaz provista y la API de la pasarela, una requerida.','IPago es una interfaz requerida y la API de la pasarela, una provista.','Ambas son interfaces provistas, porque las dos exponen operaciones.','Ambas son interfaces requeridas, porque el pedido necesita el pago.'],a:[0],e:'Provista es lo que el componente ofrece (lollipop); requerida, lo que necesita de otro (socket).',f:'U4.2 · Ejercicio CampusCoffee'},
{id:'C04',t:'comp',s:'N',q:'Un elemento de un paquete con visibilidad privada:',o:['Solo es visible para las otras clases del mismo paquete.','Solo es visible para las clases de los paquetes hijos.','Es visible desde otras clases a través de una interfaz.','No es visible ni siquiera para las clases de su paquete.'],a:[0],e:'Pública: usable desde cualquier clase, dentro o fuera del paquete. Privada: solo dentro del mismo paquete.',f:'U4.2 · Visibilidad en paquetes'},
{id:'C05',t:'comp',s:'N',q:'Una aplicación tiene presentación, negocio y acceso a datos, y todo corre en un mismo servidor. ¿Cómo se describe?',o:['Tres capas lógicas (layers) en una capa física (tier).','Una capa lógica (layer) en tres capas físicas (tiers).','Tres capas lógicas (layers) en tres capas físicas (tiers).','Un subsistema con tres nodos de procesamiento distintos.'],a:[0],e:'Layer es la separación lógica del código; tier es dónde corre. No tienen por qué coincidir uno a uno.',f:'U4.2 · Capas lógicas y físicas'},
{id:'C06',t:'comp',s:'N',m:1,q:'¿Cuáles de estos son tipos de cohesión que el apunte nombra para los componentes?',o:['Funcional','De capa','De comunicación','De contenido','Externa'],a:[0,1,2],e:'Contenido, control y externo son tipos de acoplamiento.',f:'U4.2 · Diagrama de componentes'},
{id:'C07',t:'comp',s:'N',q:'Un componente invoca procesar(tipo) y otro, según ese flag, decide con un switch qué lógica ejecutar. ¿Qué acoplamiento es?',o:['De control','De contenido','Externo','Funcional'],a:[0],e:'Se pasa un flag que controla la lógica interna del otro. Funcional no es acoplamiento, sino un tipo de cohesión.',f:'U4.2 · Acoplamiento; Pressman cap. 11'},
{id:'C08',t:'comp',s:'N',q:'Un componente modifica directamente los datos internos de otro, sin pasar por su interfaz. ¿Qué acoplamiento es?',o:['De contenido','De control','Externo','De capa'],a:[0],e:'Es el peor tipo: viola el encapsulamiento.',f:'U4.2 · Acoplamiento; Pressman cap. 11'},
{id:'C09',t:'comp',s:'N',q:'Un componente depende del formato impuesto por un servicio de terceros. ¿Qué acoplamiento es y cómo conviene tratarlo?',o:['Externo: es inevitable, pero se limita a pocos componentes.','De contenido: se elimina copiando los datos del servicio.','De control: se resuelve con un flag que elija el servicio.','Externo: se elimina por completo con una mejor cohesión.'],a:[0],e:'Se aísla, por ejemplo, con un DAO (para la base) o con una fachada (para servicios externos).',f:'U4.2 · Acoplamiento; Pressman cap. 11'},
{id:'C10',t:'comp',s:'N',q:'«Las clases que cambian juntas y por las mismas razones van en el mismo paquete». ¿Qué principio es?',o:['PCC: cierre común','PER: equivalencia de reutilización/liberación','PRC: reutilización común','OCP: abierto/cerrado'],a:[0],e:'PCC es como SRP a nivel de paquete: un cambio debería afectar a un solo paquete.',f:'U4.2 · ¿Cómo se organizan los componentes?'},
{id:'C11',t:'comp',s:'N',q:'Un paquete contiene GuardarHabitacion y GestionarUsuario, pero quien usa una nunca necesita la otra. ¿Qué principio se viola?',o:['PRC: reutilización común','PCC: cierre común','PER: equivalencia de reutilización/liberación','LSP: sustitución de Liskov'],a:[0],e:'Lo que no se reutiliza junto no debería ir junto. Es como ISP a nivel de paquete.',f:'U4.2 · ¿Cómo se organizan los componentes?'},
{id:'C12',t:'comp',s:'N',q:'«La unidad de reutilización es la unidad de liberación». ¿Qué principio expresa esa frase?',o:['PER','PCC','PRC','DIP'],a:[0],e:'Lo que se reutiliza se versiona y se libera como conjunto.',f:'U4.2 · ¿Cómo se organizan los componentes?'},
{id:'C13',t:'comp',s:'N',q:'En CampusCoffee se expone una interfaz de pago propia, sin mostrar la integración con la pasarela. ¿Por qué conviene modelar Pagos como subsistema?',o:['Porque su comportamiento se accede por interfaz y su contenido queda oculto.','Porque es el único componente del sistema que necesita acceder a la red.','Porque un subsistema se despliega siempre en un servidor físico separado.','Porque así los otros paquetes pueden usar directamente sus clases internas.'],a:[0],e:'Es la definición de subsistema. Si se cambia de pasarela, solo cambia el interior de Pagos.',f:'U4.2 · Ejercicio CampusCoffee'},

/* ---------- U4 · Despliegue ---------- */
{id:'D01',t:'desp',s:'S',q:'En un diagrama de despliegue, las relaciones «manifest» y «deploy» vinculan, respectivamente:',o:['Artefacto con componente, y artefacto con nodo.','Artefacto con nodo, y artefacto con componente.','Nodo con nodo, y clase con paquete.','Componente con clase, y nodo con base de datos.'],a:[0],e:'Manifest: el artefacto es la forma física de un componente. Deploy: el artefacto se despliega en un nodo.',f:'U4.2 · Ejercicio CampusCoffee; Práctica 16/10/26'},
{id:'D02',t:'desp',s:'N',q:'El modelo de despliegue se utiliza para mostrar:',o:['La distribución del sistema en nodos, sus enlaces y los procesos que corren en cada uno.','Los mensajes que intercambian los objetos para resolver un caso de uso en el tiempo.','Las piezas lógicas del software, junto con sus interfaces provistas y requeridas.','El ciclo de vida de un objeto, desde que se crea hasta que termina su ejecución.'],a:[0],e:'Modela la vista de despliegue estática: responde a «¿dónde corre cada pieza?».',f:'U4.2 · Modelo de despliegue'},
{id:'D03',t:'desp',s:'N',q:'Un servidor físico aloja Tomcat, y Tomcat aloja el archivo app.war. ¿Qué estereotipo corresponde a cada elemento, en ese orden?',o:['«device», «executionEnvironment», «artifact»','«executionEnvironment», «device», «artifact»','«device», «artifact», «executionEnvironment»','«component», «executionEnvironment», «device»'],a:[0],e:'Device es hardware; el entorno de ejecución es software que aloja a otro software; el artefacto es el archivo concreto.',f:'Práctica 16/10/26 · Elementos y notación'},
{id:'D04',t:'desp',s:'N',m:1,q:'¿Cuáles de estos son errores comunes al hacer un diagrama de despliegue?',o:['Poner clases dentro de los nodos en lugar de artefactos.','Olvidar los sistemas externos, como LDAP o un servicio de IA.','Detallar routers, switches e IP de la red.','Etiquetar los caminos de comunicación con el protocolo.'],a:[0,1,2],e:'Nombrar el protocolo en cada camino es justamente lo que se pide.',f:'Práctica 16/10/26 · Errores comunes'},
{id:'D05',t:'desp',s:'N',q:'En una aplicación web en 3 capas con Tomcat y PostgreSQL, ¿qué caminos de comunicación son los esperables?',o:['Navegador a servidor de aplicaciones por HTTPS; servidor de aplicaciones a BD por JDBC.','Navegador a BD por JDBC; servidor de aplicaciones a navegador por LDAP.','Navegador a servidor de aplicaciones por JDBC; servidor de aplicaciones a BD por HTTPS.','Navegador a BD por HTTPS; navegador a servidor de aplicaciones por JDBC.'],a:[0],e:'En la web, solo el servidor accede a la base; el cliente únicamente tiene un navegador.',f:'Práctica 16/10/26 · Ejemplo web en 3 capas'},
{id:'D06',t:'desp',s:'N',q:'Un diagrama muestra el nodo «srv-bd01 : Servidor de BD» con el nombre subrayado. ¿Qué forma de diagrama es?',o:['De instancia: describe una instalación real con nodos concretos.','De descriptor: describe tipos de nodos y la arquitectura general.','De componentes: describe las piezas lógicas y sus interfaces.','De paquetes: describe un agrupamiento en capas lógicas.'],a:[0],e:'El descriptor muestra tipos (Servidor de BD); la instancia muestra nodos concretos con el nombre subrayado.',f:'Práctica 16/10/26 · Descriptor vs. instancia'},
{id:'D07',t:'desp',s:'N',m:1,q:'Respecto del despliegue en 3 capas web frente al de escritorio en 2 capas, ¿cuáles son ventajas de la opción web?',o:['Una versión nueva se actualiza una sola vez, en el servidor.','La base de datos queda protegida: solo el servidor accede a ella.','Se puede acceder desde cualquier lugar, por ejemplo, desde casa.','Sigue funcionando normalmente sin conexión a la red.','Requiere menos nodos que la solución de escritorio.'],a:[0,1,2],e:'La opción web suma un nodo más y sin conexión no funciona.',f:'Práctica 16/10/26 · Escritorio vs. web'},
{id:'D08',t:'desp',s:'N',q:'En un nodo con Tomcat aparece web.xml. ¿Con qué estereotipo se lo representa?',o:['«deployment spec»','«executionEnvironment»','«manifest»','«device»'],a:[0],e:'Es la especificación de despliegue: los parámetros de configuración.',f:'U4.2 · Elementos; Práctica 16/10/26'},
{id:'D09',t:'desp',s:'N',q:'¿Qué pregunta responde cada diagrama?',o:['Componentes: ¿en qué piezas se organiza el software? Despliegue: ¿dónde corre cada pieza?','Componentes: ¿dónde corre cada pieza? Despliegue: ¿en qué piezas se organiza el software?','Componentes: ¿cómo colaboran los objetos? Despliegue: ¿qué hace el sistema?','Componentes: ¿qué hace el sistema? Despliegue: ¿cómo colaboran los objetos?'],a:[0],e:'Componentes corresponde a la vista de implementación; despliegue, a la vista física.',f:'Práctica 16/10/26 · Dónde encaja cada diagrama'},

/* ---------- U4 · Secuencia ---------- */
{id:'Q01',t:'sec',s:'N',m:1,q:'¿Cuáles de estos son componentes de un diagrama de secuencia?',o:['Líneas de vida','Mensajes','Barras de activación','Fragmentos','Nodos'],a:[0,1,2,3],e:'Son objetos o actores, líneas de vida, mensajes, barras de activación y fragmentos. Los nodos son del diagrama de despliegue.',f:'Práctica 11/09/26 · Componentes'},
{id:'Q02',t:'sec',s:'N',q:'«Si no hay resultados, mostrar un mensaje; si hay, mostrar la grilla». ¿Qué fragmento combinado corresponde?',o:['alt','opt','loop','par'],a:[0],e:'Hay dos caminos alternativos con guardas, y se ejecuta solo uno.',f:'Práctica 11/09/26 · Fragmentos'},
{id:'Q03',t:'sec',s:'N',q:'«Si el cliente pidió factura, además enviársela por correo». ¿Qué fragmento combinado corresponde?',o:['opt','alt','loop','par'],a:[0],e:'Es una única secuencia que se ejecuta solo si se cumple la condición: un if sin else.',f:'Práctica 11/09/26 · Fragmentos'},
{id:'Q04',t:'sec',s:'N',q:'«Por cada factura seleccionada, actualizar su estado». ¿Qué fragmento combinado corresponde?',o:['loop','alt','opt','par'],a:[0],e:'Es una secuencia que se repite.',f:'Práctica 11/09/26 · Fragmentos'},
{id:'Q05',t:'sec',s:'N',q:'Guardar la nota de crédito y actualizar las facturas se modelan como operaciones simultáneas. ¿Qué fragmento combinado corresponde?',o:['par','alt','opt','loop'],a:[0],e:'Es el fragmento del ejemplo CU-19 de la práctica.',f:'Práctica 11/09/26 · CU-19'},
{id:'Q06',t:'sec',s:'N',q:'¿Cómo se representa la creación de un objeto en un diagrama de secuencia?',o:['Con una flecha punteada «create» que apunta a la cabecera del objeto nuevo.','Con una X en el extremo inferior de la línea de vida del objeto nuevo.','Con una barra de activación que empieza en la parte superior del diagrama.','Con un fragmento opt que contiene una línea de vida del objeto nuevo.'],a:[0],e:'La X representa la destrucción.',f:'Práctica 11/09/26 · Tipos de mensajes'},
{id:'Q07',t:'sec',s:'N',m:1,q:'¿Qué se necesita antes de armar el diagrama de secuencia de un caso de uso?',o:['La descripción completa del caso de uso, con flujos alternativos.','El diagrama de clases, para saber qué objetos y caminos existen.','El diagrama de despliegue, con los nodos de procesamiento finales.','Los resultados de las pruebas de sistema del caso de uso.'],a:[0,1],e:'El flujo de mensajes sigue la narración del CU, y las clases indican qué objetos interactúan.',f:'Práctica 11/09/26 · Vinculación con otros diagramas'},
{id:'Q08',t:'sec',s:'N',q:'En un diagrama, la UI llama directamente a FacturaDAO. ¿Qué problema tiene según el esquema de capas de la práctica?',o:['La UI no debería hablar con el DAO: el flujo es Actor, UI, Gestor, DAO.','Ninguno, porque la UI es la encargada de resolver el acceso a los datos.','El DAO debe ser quien llame a la UI, para devolverle los datos pedidos.','Falta un fragmento par entre la UI y el DAO para acelerar la consulta.'],a:[0],e:'La UI nunca habla directo con el DAO, ni el DAO conoce a la UI.',f:'Práctica 11/09/26 · CU-19'},
{id:'Q09',t:'sec',s:'N',q:'Al armar la secuencia aparece un mensaje síncrono a GestorFactura cuyo método no existe en el diagrama de clases. ¿Qué corresponde hacer?',o:['Agregar la operación a la clase: los diagramas se ajustan entre sí.','Reemplazarlo por un mensaje asíncrono, que no necesita una operación.','Dejarlo así, porque el diagrama de secuencia no se vincula con las clases.','Eliminar el mensaje, porque el diagrama de clases ya está cerrado.'],a:[0],e:'Cada mensaje a un objeto debería ser una operación de su clase; al hacer la secuencia suelen aparecer métodos faltantes.',f:'Práctica 11/09/26 · Vinculación con otros diagramas'},
{id:'Q10',t:'sec',s:'N',m:1,q:'Respecto de los diagramas de secuencia y de colaboración, ¿qué afirmaciones son correctas?',o:['Ambos son diagramas de interacción.','El de secuencia enfatiza el orden temporal de los mensajes.','El de colaboración enfatiza los vínculos entre los objetos.','En el de colaboración el tiempo es el eje vertical explícito.'],a:[0,1,2],e:'En el de colaboración, el orden se indica con números de secuencia. El tiempo vertical es propio del de secuencia.',f:'Resumen U4 · Secuencia vs. colaboración; Final 03/2012'},
{id:'Q11',t:'sec',s:'N',q:'En un diagrama de secuencia, la línea de vida se dibuja como:',o:['Una línea vertical punteada bajo el objeto: bajar es avanzar en el tiempo.','Una línea horizontal continua entre objetos: avanzar es enviar un mensaje.','Un rectángulo angosto sobre el objeto: indica que está procesando algo.','Una caja con una etiqueta arriba a la izquierda, como un fragmento.'],a:[0],e:'El rectángulo angosto es la barra de activación; la caja con etiqueta, un fragmento.',f:'Práctica 11/09/26 · Componentes'},

/* ---------- U5 · Patrones: fundamentos ---------- */
{id:'T01',t:'pat',s:'N',m:1,q:'Según el apunte, ¿qué NO buscan los patrones de diseño?',o:['Imponer ciertas alternativas de diseño frente a otras.','Eliminar la creatividad inherente al proceso de diseño.','Ser de uso obligatorio en todo sistema.','Formalizar un vocabulario común entre diseñadores.','Condensar conocimiento para las nuevas generaciones.'],a:[0,1,2],e:'Las dos últimas sí son objetivos. «Abusar o forzar el uso de los patrones puede ser un error».',f:'U5.1 · Que no buscan'},
{id:'T02',t:'pat',s:'N',q:'Los problemas relacionados con la composición de clases y objetos corresponden a patrones:',o:['Estructurales','De creación','De comportamiento','De arquitectura'],a:[0],e:'Creación: cómo se crean objetos. Comportamiento: cómo interactúan y reparten responsabilidades.',f:'U5.1 · Clasificación del patrón'},
{id:'T03',t:'pat',s:'N',q:'Los patrones de bajo nivel específicos de un lenguaje de programación o de un entorno concreto se llaman:',o:['Dialectos','Patrones de arquitectura','Patrones de diseño','Patrones estructurales'],a:[0],e:'Las categorías son patrones de arquitectura, patrones de diseño y dialectos.',f:'U5.1 · Categorías de patrones'},
{id:'T04',t:'pat',s:'N',q:'¿Cómo se clasifican Singleton, Facade y Mediator, en ese orden?',o:['De creación, estructural y de comportamiento.','Estructural, de comportamiento y de creación.','De creación, de comportamiento y estructural.','De comportamiento, estructural y de creación.'],a:[0],e:'También Bridge es estructural y State es de comportamiento.',f:'U5.1 · Catálogo de patrones'},
{id:'T05',t:'pat',s:'N',m:1,q:'Para que una solución se considere un patrón de diseño, debe:',o:['Haber comprobado su efectividad en problemas similares anteriores.','Ser reutilizable en diferentes problemas y circunstancias.','Estar implementada en un lenguaje de programación concreto.','Aplicarse siempre que se diseñe un sistema nuevo.'],a:[0,1],e:'Es la definición del apunte. No es de uso obligatorio ni está atado a un lenguaje; eso último sería un dialecto.',f:'U5.1 · ¿Qué es un patrón de diseño?'},
{id:'T06',t:'pat',s:'N',q:'¿Cuándo es aconsejable usar un patrón de diseño?',o:['Cuando se tiene el mismo problema que resuelve u otro similar, y resulta aplicable al caso.','Siempre que sea posible, porque más patrones implican un mejor diseño del sistema.','Solo en sistemas con muchas clases, porque en los chicos están prohibidos por el catálogo.','Solo al final del desarrollo, cuando ya no quedan cambios de requerimientos por resolver.'],a:[0],e:'No es de uso obligatorio; en un caso particular puede no ser aplicable.',f:'U5.1 · Que no buscan'},

/* ---------- U5 · State y Singleton ---------- */
{id:'A01',t:'ss',s:'S',q:'¿Qué problema resuelve el patrón State?',o:['Objetos cuyo comportamiento varía según su estado actual, evitando condicionales extensos.','Garantizar que una clase tenga una única instancia con un punto de acceso global.','Ofrecer una interfaz unificada y simplificada para un subsistema muy complejo.','Desacoplar una abstracción de su implementación para que varíen por separado.'],a:[0],e:'Permite que un objeto modifique su comportamiento cuando cambia su estado: parecerá que cambia de clase.',f:'U5.1 · State'},
{id:'A02',t:'ss',s:'S',m:1,q:'¿Cuáles son elementos de un Singleton correcto?',o:['Constructor privado.','Atributo estático que guarda la instancia.','Método estático getInstance().','Constructor público para permitir clonarlo.'],a:[0,1,2],e:'El objeto no debe ser clonable: habría una segunda instancia.',f:'U5.1 · Singleton'},
{id:'A03',t:'ss',s:'N',m:1,q:'La clase Pedido resuelve sus estados con if/else en cada método. ¿Qué problemas tiene esa solución?',o:['Cada estado nuevo obliga a modificar todos los métodos.','Hay un alto riesgo de errores por condicionales anidados.','Viola el principio abierto/cerrado.','Impide guardar el estado actual del pedido.'],a:[0,1,2],e:'El estado se puede guardar sin problema; lo costoso es mantener la lógica que depende de él.',f:'U5.1 · Ejercicio 1: problemas'},
{id:'A04',t:'ss',s:'N',q:'En la estructura de State, ¿quién mantiene la referencia al estado actual y le delega las operaciones?',o:['El Contexto','La interfaz Estado','Cada Estado concreto','El Cliente'],a:[0],e:'Pedido es el contexto: guarda el estado y delega. Los estados concretos implementan el comportamiento.',f:'U5.1 · State: estructura'},
{id:'A05',t:'ss',s:'N',q:'¿Qué muestra este fragmento del ejercicio del Pedido?',c:'public void cancelar() {\n    estado.cancelar(this);\n}',o:['El contexto delega en su estado actual, y le pasa una referencia a sí mismo.','El contexto decide con condicionales cuál estado concreto debe ejecutar.','El estado concreto delega en el contexto, y este resuelve la cancelación.','El contexto crea una instancia única del estado y la comparte globalmente.'],a:[0],e:'Pasar this permite que el estado provoque la transición con setEstado.',f:'U5.1 · Resolución con State'},
{id:'A06',t:'ss',s:'N',q:'Con State aplicado, el negocio pide agregar EN_CAMINO entre LISTO y ENTREGADO. ¿Qué cambio se necesita?',o:['Crear la clase del estado nuevo y ajustar la transición de LISTO.','Agregar un if en todos los métodos de la clase Pedido.','Reescribir todas las clases de estado existentes.','Modificar la interfaz y agregar un método por estado.'],a:[0],e:'No hay que tocar el contexto ni los demás estados: es la mejora sobre la solución con if/else.',f:'U5.1 · Ejercicio 1: modificación'},
{id:'A07',t:'ss',s:'N',q:'Un documento pasa por Borrador, Revisión y Publicado, y publicar() se comporta distinto en cada caso, con mucho código. ¿Qué patrón aplica?',o:['State','Singleton','Facade','Bridge'],a:[0],e:'Estados con operaciones comunes que varían según en cuál se encuentra, y mucho código variable.',f:'U5.1 · State: aplicabilidad'},
{id:'A08',t:'ss',s:'N',q:'La aplicación debe leer una sola vez la URL y la base de datos, y dar acceso a esos datos desde cualquier parte. ¿Qué patrón aplica?',o:['Singleton','State','Mediator','Bridge'],a:[0],e:'Es el ejemplo del Configurador: una única instancia en un punto de acceso bien conocido.',f:'U5.1 · Singleton'},
{id:'A09',t:'ss',s:'N',m:1,q:'¿Cuáles son consideraciones de implementación de Singleton que da el apunte?',o:['El objeto no debe ser clonable.','Los métodos o la clase deben declararse como final.','El constructor debe ser público y sin parámetros.','Debe existir una instancia por cada hilo de ejecución.'],a:[0,1],e:'Si se pudiera clonar o heredar, podrían aparecer otras instancias.',f:'U5.1 · Singleton: consideraciones'},
{id:'A10',t:'ss',s:'N',q:'¿Qué ocurre en la segunda llamada a este método?',c:'public synchronized static Configurador getInstance() {\n    if (miconfigurador == null) {\n        miconfigurador = new Configurador(url, baseDatos);\n    }\n    return miconfigurador;\n}',o:['Devuelve la misma instancia creada en la primera llamada.','Crea una instancia nueva y descarta la anterior.','Lanza una excepción porque la instancia ya existe.','Devuelve null hasta que se libere la primera instancia.'],a:[0],e:'Solo crea el objeto si todavía no existe. synchronized evita que dos hilos lo creen a la vez.',f:'U5.1 · Singleton'},

/* ---------- U5 · Facade, Bridge y Mediator ---------- */
{id:'F01',t:'fbm',s:'S',q:'Respecto del patrón Facade, ¿qué afirmación es correcta?',o:['No impide que las aplicaciones usen directamente las clases del subsistema si lo necesitan.','Elimina las clases del subsistema, porque toda su funcionalidad pasa a vivir en la fachada.','Prohíbe el acceso directo a las clases del subsistema y las vuelve privadas para el cliente.','Obliga a que las clases del subsistema conozcan a la fachada y le deleguen las peticiones.'],a:[0],e:'Simplifica el acceso, pero no lo restringe. Las clases del subsistema no conocen a la fachada.',f:'U5.2 · Facade: consecuencias'},
{id:'F02',t:'fbm',s:'S',q:'Reportes (Ventas, Empleados, Inventario) en formatos (PDF, Excel, HTML). ¿Qué busca Bridge?',o:['Separar el tipo de reporte y el formato en jerarquías independientes.','Crear una clase por cada combinación de tipo de reporte y formato.','Unificar todos los formatos en una única clase con condicionales.','Heredar cada formato desde cada uno de los tipos de reporte.'],a:[0],e:'Abstracción: qué tipo de reporte es. Implementación: en qué formato se genera. Se unen por composición.',f:'U5.2 · Bridge: ejercicio'},
{id:'F03',t:'fbm',s:'S',q:'¿Cuál es la diferencia clave entre Mediator y Facade?',o:['Mediator coordina la comunicación entre colegas; Facade simplifica el acceso a un subsistema.','Facade coordina la comunicación entre colegas; Mediator simplifica el acceso a un subsistema.','Mediator es un patrón de creación de objetos; Facade es un patrón de comportamiento.','En ambos, las clases participantes conocen al objeto central y se comunican a través de él.'],a:[0],e:'Los colegas conocen al mediador; las clases del subsistema no conocen a la fachada.',f:'U5.2 · Facade y Mediator'},
{id:'F04',t:'fbm',s:'N',q:'En la apertura de cuenta online, el banco agrega ServicioAntiFraude. Con Facade, ¿dónde se hace el cambio?',o:['En la fachada, sin tocar al cliente.','En el cliente, sin tocar la fachada.','En todos los servicios ya existentes.','En la fachada y también en cada cliente.'],a:[0],e:'El cliente solo conoce a la fachada; ella es quien orquesta los subsistemas.',f:'U5.2 · Ejercicio de apertura de cuenta'},
{id:'F05',t:'fbm',s:'N',m:1,q:'¿Cuáles son aplicaciones o consecuencias del patrón Facade?',o:['Proporciona una interfaz única para un subsistema complejo.','Promueve un débil acoplamiento entre el subsistema y sus clientes.','Ayuda a dividir los subsistemas en capas.','Agrega funcionalidad que el subsistema no podía brindar.'],a:[0,1,2],e:'La fachada delega en los objetos apropiados: no agrega funcionalidad nueva.',f:'U5.2 · Facade: aplicabilidad y consecuencias'},
{id:'F06',t:'fbm',s:'N',q:'Con 3 tipos de reporte y 3 formatos, ¿cuántas clases concretas de combinación hacen falta con herencia, y cuántas con Bridge?',o:['Herencia: 9. Bridge: 3 + 3.','Herencia: 6. Bridge: 3 × 3.','Herencia: 3 + 3. Bridge: 9.','Herencia: 9. Bridge: 9.'],a:[0],e:'Con herencia, la cantidad se multiplica; con Bridge, se suma. Un formato nuevo con herencia agrega 3 clases, y con Bridge, una.',f:'U5.2 · Bridge: ejercicio'},
{id:'F07',t:'fbm',s:'N',q:'En Bridge, ¿quién mantiene una referencia al objeto de tipo Implementor?',o:['Abstraction','ConcreteImplementor','El propio Implementor','Ningún participante: se usa herencia'],a:[0],e:'Abstraction define la interfaz de alto nivel y contiene la referencia: Bridge usa composición en lugar de herencia.',f:'U5.2 · Bridge: participantes'},
{id:'F08',t:'fbm',s:'N',q:'En el control de tráfico aéreo, aviones, pistas y servicios en tierra se comunican solo a través de la torre de control. ¿Qué rol tiene la torre?',o:['Mediator','Facade','Colleague','Implementor'],a:[0],e:'Los aviones y las pistas son colegas: no se conocen entre sí, y solo conocen al mediador.',f:'U5.2 · Mediator: ejercicio'},
{id:'F09',t:'fbm',s:'N',q:'En la sala de chat, Usuario tiene enviarMensaje() y recibirMensaje(). ¿Qué rol tiene cada clase?',o:['Sala es ConcreteMediator y Usuario es ConcreteColleague.','Sala es ConcreteColleague y Usuario es ConcreteMediator.','Sala es Facade y Usuario es una clase del subsistema.','Sala es Abstraction y Usuario es ConcreteImplementor.'],a:[0],e:'La sala centraliza la comunicación y reenvía los mensajes a los demás usuarios.',f:'U5.2 · Mediator: sala de chat'},
{id:'F10',t:'fbm',s:'N',q:'Muchos objetos interactúan de forma compleja pero bien definida, y un cambio en una clase afecta a muchas otras. ¿Qué patrón aplica?',o:['Mediator','Singleton','Facade','Bridge'],a:[0],e:'Reduce el acoplamiento directo: se centraliza el control y la lógica de comunicación.',f:'U5.2 · Mediator: aplicabilidad'},
{id:'F11',t:'fbm',s:'N',q:'Un sistema debe soportar varias plataformas y formatos, y usar herencia lo vuelve engorroso por las múltiples dimensiones de variación. ¿Qué patrón aplica?',o:['Bridge','Facade','Mediator','State'],a:[0],e:'Las dimensiones de variación son la motivación de Bridge.',f:'U5.2 · Bridge: motivación'},

/* ---------- U5 · Strategy, Observer, Factory y Adapter: solo nombrados en el apunte; se basan en el libro ---------- */
{id:'K01',t:'gof',s:'N',q:'¿Cuál es la intención del patrón Strategy?',o:['Definir una familia de algoritmos, encapsular cada uno y hacerlos intercambiables.','Definir una dependencia de uno a muchos para notificar los cambios de un objeto.','Convertir la interfaz de una clase en otra que es la que esperan sus clientes.','Permitir que las subclases decidan qué clase concreta se debe instanciar.'],a:[0],e:'El algoritmo puede variar independientemente de los clientes que lo usan.',f:'Gamma et al. · Strategy; nombrado en U5.1 y U5.2'},
{id:'K02',t:'gof',s:'N',q:'Un sistema calcula el envío de forma terrestre, aérea o con retiro en sucursal, y el medio se puede cambiar en tiempo de ejecución. ¿Qué patrón aplica?',o:['Strategy','Observer','Adapter','Abstract Factory'],a:[0],e:'Cada forma de cálculo es una estrategia concreta y el contexto la usa a través de una interfaz común.',f:'Gamma et al. · Strategy'},
{id:'K03',t:'gof',s:'N',m:1,q:'¿Cuáles son participantes del patrón Strategy?',o:['Context','Strategy','ConcreteStrategy','Adaptee','Subject'],a:[0,1,2],e:'Adaptee pertenece a Adapter, y Subject pertenece a Observer.',f:'Gamma et al. · Strategy'},
{id:'K04',t:'gof',s:'N',q:'State y Strategy tienen una estructura parecida. ¿Qué los diferencia habitualmente?',o:['En State, el comportamiento cambia con el estado interno; en Strategy, suele elegirlo el cliente.','En Strategy, el comportamiento cambia con el estado interno; en State, suele elegirlo el cliente.','State es un patrón de creación de objetos; Strategy es un patrón estructural de clases.','State reemplaza a la herencia por composición; Strategy reemplaza a la composición por herencia.'],a:[0],e:'Los dos delegan en un objeto intercambiable, pero tienen distinta intención.',f:'Gamma et al. · State y Strategy'},
{id:'K05',t:'gof',s:'N',q:'CalculadoraDeArea usa un if por cada figura y se reemplaza por objetos intercambiables detrás de una interfaz. ¿Qué principio SOLID favorece ese cambio?',o:['Abierto/cerrado','Segregación de interfaces','Sustitución de Liskov','Responsabilidad única'],a:[0],e:'Un comportamiento nuevo se agrega con una clase nueva, sin modificar el código existente.',f:'U5.4 · OCP; Gamma et al. · Strategy'},
{id:'K06',t:'gof',s:'N',q:'¿Cuál es la intención del patrón Observer?',o:['Definir una dependencia de uno a muchos: al cambiar un objeto, se notifica a sus dependientes.','Centralizar en un objeto mediador toda la comunicación entre objetos que son colegas.','Encapsular una familia de algoritmos intercambiables detrás de una misma interfaz.','Ofrecer una interfaz unificada y simplificada para acceder a un subsistema complejo.'],a:[0],e:'Los dependientes se actualizan automáticamente y el sujeto no necesita conocer sus clases concretas.',f:'Gamma et al. · Observer; nombrado en U5.1 y U5.2'},
{id:'K07',t:'gof',s:'N',q:'Cuando cambia el estado de un pedido, hay que avisar por correo y SMS a los suscriptos, sin acoplar el pedido a cada canal. ¿Qué patrón aplica?',o:['Observer','Bridge','Singleton','Factory Method'],a:[0],e:'El pedido es el sujeto, y cada canal de notificación es un observador.',f:'Gamma et al. · Observer'},
{id:'K08',t:'gof',s:'N',m:1,q:'¿Cuáles son participantes del patrón Observer?',o:['Subject','Observer','ConcreteObserver','ConcreteCreator','Colleague'],a:[0,1,2],e:'También participa ConcreteSubject. ConcreteCreator es de Factory Method, y Colleague es de Mediator.',f:'Gamma et al. · Observer'},
{id:'K09',t:'gof',s:'N',q:'¿Qué conoce el sujeto sobre sus observadores en Observer?',o:['Solo que cumplen la interfaz Observer, no sus clases concretas.','Las clases concretas de todos, para llamar a cada método propio.','Nada, porque son los observadores quienes se notifican entre sí.','Solo al primero de la lista, que se encarga de avisarles al resto.'],a:[0],e:'Por eso el acoplamiento entre el sujeto y los observadores es débil y se pueden sumar observadores nuevos.',f:'Gamma et al. · Observer'},
{id:'K10',t:'gof',s:'N',q:'¿Cuál es la intención del patrón Factory Method?',o:['Definir una interfaz para crear un objeto, y que las subclases decidan qué clase instanciar.','Crear familias de objetos relacionados, sin especificar sus clases concretas en el cliente.','Asegurar que una clase tenga una única instancia y ofrecer un punto de acceso global.','Desacoplar una abstracción de su implementación, para que ambas varíen por separado.'],a:[0],e:'Delega la creación en las subclases. Según el catálogo, es un patrón de creación a nivel de clase.',f:'Gamma et al. · Factory Method; catálogo U5.1'},
{id:'K11',t:'gof',s:'N',q:'En Factory Method, GeneradorPDF redefine crearDocumento() y devuelve un DocumentoPDF. ¿Qué rol cumple GeneradorPDF?',o:['ConcreteCreator','ConcreteProduct','Creator','Product'],a:[0],e:'GeneradorDocumento es Creator, Documento es Product y DocumentoPDF es ConcreteProduct.',f:'Gamma et al. · Factory Method'},
{id:'K12',t:'gof',s:'N',m:1,q:'¿Cuándo conviene aplicar Factory Method?',o:['Una clase no puede prever qué clase de objetos debe crear.','Una clase quiere que sus subclases especifiquen los objetos que crea.','Hay que garantizar que exista una sola instancia en toda la aplicación.','Hay que adaptar una clase ya existente a una interfaz incompatible.'],a:[0,1],e:'La instancia única corresponde a Singleton, y la adaptación de interfaces, a Adapter.',f:'Gamma et al. · Factory Method'},
{id:'K13',t:'gof',s:'N',q:'¿Cuál es la intención del patrón Abstract Factory?',o:['Ofrecer una interfaz para crear familias de objetos relacionados, sin indicar sus clases concretas.','Definir un método de creación de un único producto, que cada subclase decide cómo instanciar.','Convertir la interfaz de una fábrica ya existente en otra que sea compatible con el cliente.','Garantizar que cada familia de objetos tenga una sola instancia, con un punto de acceso global.'],a:[0],e:'Según el catálogo, es un patrón de creación a nivel de objeto.',f:'Gamma et al. · Abstract Factory; catálogo U5.1'},
{id:'K14',t:'gof',s:'N',q:'Una aplicación debe crear botones y ventanas coherentes entre sí, según se use el tema claro o el oscuro. ¿Qué patrón aplica mejor?',o:['Abstract Factory','Adapter','Observer','Mediator'],a:[0],e:'Cada fábrica concreta crea una familia completa de productos que deben usarse juntos.',f:'Gamma et al. · Abstract Factory'},
{id:'K15',t:'gof',s:'N',q:'¿Cuál es la principal diferencia entre Factory Method y Abstract Factory?',o:['Factory Method crea un producto mediante subclases; Abstract Factory crea familias de productos relacionados.','Abstract Factory crea un producto mediante subclases; Factory Method crea familias de productos relacionados.','Factory Method es un patrón estructural; Abstract Factory es un patrón de comportamiento entre objetos.','Factory Method solo sirve para bases de datos; Abstract Factory solo sirve para interfaces gráficas.'],a:[0],e:'Se relacionan: el mapa de patrones de la 5.2 indica que Abstract Factory se puede implementar usando Factory Method.',f:'Gamma et al.; U5.2 · Relación entre patrones'},
{id:'K16',t:'gof',s:'N',q:'¿Cuál es una desventaja de Abstract Factory?',o:['Agregar un tipo de producto nuevo obliga a cambiar la interfaz de la fábrica y sus subclases.','Cambiar de una familia de productos a otra obliga a reescribir a todos los clientes.','Los productos de una misma familia no se pueden usar juntos de manera consistente.','El cliente queda acoplado a las clases concretas de cada uno de los productos.'],a:[0],e:'Las familias se cambian con facilidad y se mantiene su consistencia; lo costoso es sumar nuevos tipos de producto.',f:'Gamma et al. · Abstract Factory'},
{id:'K17',t:'gof',s:'N',q:'Según el mapa «Relación entre patrones», ¿qué vínculo hay entre Abstract Factory y Singleton?',o:['Una fábrica concreta suele tener una única instancia.','Singleton se implementa usando una Abstract Factory.','Abstract Factory reemplaza por completo a Singleton.','Los dos patrones no se pueden usar en un mismo diseño.'],a:[0],e:'La flecha del mapa dice «single instance». La misma relación aparece entre Facade y Singleton.',f:'U5.2 · Relación entre patrones'},
{id:'K18',t:'gof',s:'N',q:'¿Cuál es la intención del patrón Adapter?',o:['Convertir la interfaz de una clase en otra que esperan los clientes, para que trabajen juntas.','Ofrecer una interfaz nueva y simplificada para todo un subsistema compuesto por muchas clases.','Desacoplar una abstracción de su implementación, para que ambas evolucionen por separado.','Definir una interfaz para crear objetos, y dejar que las subclases elijan la clase concreta.'],a:[0],e:'Permite que colaboren clases que de otro modo no podrían hacerlo, por tener interfaces incompatibles.',f:'Gamma et al. · Adapter; catálogo U5.1'},
{id:'K19',t:'gof',s:'N',q:'El sistema trabaja con la interfaz IPago y hay que integrar una pasarela externa cuya API tiene otros métodos, que no se pueden modificar. ¿Qué patrón aplica?',o:['Adapter','Strategy','Observer','Singleton'],a:[0],e:'Un adaptador implementa IPago y traduce cada llamada a la API de la pasarela.',f:'Gamma et al. · Adapter'},
{id:'K20',t:'gof',s:'N',q:'En ese caso, IPago es la interfaz del sistema y la pasarela es la clase externa. ¿Qué rol tiene cada una?',o:['IPago es Target y la pasarela es Adaptee.','IPago es Adaptee y la pasarela es Target.','IPago es Adapter y la pasarela es Client.','IPago es Client y la pasarela es Adapter.'],a:[0],e:'El Adapter implementa Target y delega en Adaptee. El Client trabaja solo con Target.',f:'Gamma et al. · Adapter'},
{id:'K21',t:'gof',s:'N',q:'¿Qué diferencia a Adapter de Facade?',o:['Adapter hace compatible una interfaz existente; Facade define una interfaz nueva y simple para un subsistema.','Facade hace compatible una interfaz existente; Adapter define una interfaz nueva y simple para un subsistema.','Adapter solo se puede usar con un subsistema completo; Facade solo se puede usar con una única clase.','Adapter es un patrón de comportamiento; Facade es un patrón de creación de objetos.'],a:[0],e:'Los dos envuelven código existente, pero con distinta intención. Ambos son estructurales.',f:'Gamma et al. · Adapter y Facade; U5.2'},
{id:'K22',t:'gof',s:'N',q:'¿Qué diferencia a Adapter de Bridge?',o:['Adapter suele aplicarse a clases ya diseñadas; Bridge se plantea desde el diseño para que dos jerarquías varíen.','Bridge suele aplicarse a clases ya diseñadas; Adapter se plantea desde el diseño para que dos jerarquías varíen.','Adapter separa siempre dos jerarquías por composición; Bridge convierte la interfaz de una única clase.','Adapter es un patrón de creación de objetos; Bridge es un patrón de comportamiento entre colegas.'],a:[0],e:'Adapter hace que funcionen cosas que ya existen; Bridge las prepara antes de que existan.',f:'Gamma et al. · Adapter y Bridge; U5.2'},
{id:'K23',t:'gof',s:'N',m:1,q:'Según el catálogo de patrones de la cátedra, ¿qué clasificaciones son correctas?',o:['Strategy: de comportamiento','Observer: de comportamiento','Factory Method: de creación','Abstract Factory: de creación','Adapter: de comportamiento'],a:[0,1,2,3],e:'Adapter es de estructura, y es el único de estos que figura tanto a nivel de clase como de objeto.',f:'U5.1 y U5.2 · Catálogo de patrones'},

/* ---------- U5 · DAO y DTO ---------- */
{id:'B01',t:'dao',s:'S',q:'Respecto de un DAO cuyo método buscarPorIsbn devuelve un LibroDTO, ¿qué se puede afirmar?',o:['Es un error: mezcla dos responsabilidades y el DAO queda atado a una vista.','Es lo correcto: el DAO siempre debe armar el DTO que necesita cada pantalla.','Es indiferente: un DTO y una entidad representan lo mismo en todas las capas.','Es obligatorio: la entidad no puede salir de la capa de acceso a datos nunca.'],a:[0],e:'El mismo libro se muestra distinto en tres pantallas. Si el DAO devuelve la entidad, cada caso arma el DTO que quiera.',f:'Práctica DAO y DTO · Errores combinando DAO y DTO'},
{id:'B02',t:'dao',s:'S',m:1,q:'¿Cuáles son características de un DTO?',o:['Transporta datos entre capas.','No contiene lógica de negocio.','Puede tener getters y setters.','Puede limitar los datos expuestos.','Se conecta directamente a la base de datos.'],a:[0,1,2,3],e:'Es una «valija»: no piensa ni decide. El acceso a la base corresponde al DAO.',f:'Práctica DAO y DTO · Presentando al DTO'},
{id:'B03',t:'dao',s:'N',q:'La tabla libros tiene la columna precio_costo, de uso interno, y la entidad completa se devuelve a la UI. ¿Qué problema hay y qué lo resuelve?',o:['El dato queda expuesto en el navegador; se resuelve con un DTO que solo lleve lo necesario.','El dato queda expuesto en el navegador; se resuelve agregando más métodos a la entidad.','La consulta se vuelve más lenta; se resuelve con un DAO adicional para esa misma tabla.','La consulta se vuelve más lenta; se resuelve con un Singleton que guarde el dato en memoria.'],a:[0],e:'El DTO es el filtro: la valija armada a propósito con solo lo que querés que viaje.',f:'Práctica DAO y DTO · ¿Por qué un DTO?'},
{id:'B04',t:'dao',s:'N',m:1,q:'¿Por qué conviene definir el DAO como interfaz y no como clase directa?',o:['Permite tener varias implementaciones, como MySQL, Mongo o Fake.','Permite probar la lógica de negocio sin una base real corriendo.','Hace que el negocio dependa de una abstracción (inversión de dependencias).','Evita tener que escribir las consultas a la base de datos.'],a:[0,1,2],e:'Las consultas se siguen escribiendo, pero dentro de cada implementación.',f:'Práctica DAO y DTO · ¿Por qué interfaz?'},
{id:'B05',t:'dao',s:'N',q:'¿Qué se puede decir de esta clase?',c:'public class LibroDTO {\n    private String isbn;\n    private int stock;\n    public boolean hayStock(int pedido) {\n        return stock >= pedido && validarIsbn();\n    }\n}',o:['Dejó de ser un DTO: calcula y valida, cuando solo debería transportar datos.','Es un DTO correcto, porque un DTO debe validar los datos que transporta.','Es un DAO correcto, porque tiene atributos y consulta el stock disponible.','Es un Singleton incompleto, porque le falta un método getInstance().'],a:[0],e:'Regla de oro: si un DTO calcula, valida o llama a otra clase, dejó de ser un DTO.',f:'Práctica DAO y DTO · Regla de oro del DTO'},
{id:'B06',t:'dao',s:'N',q:'¿Cuál es la responsabilidad de un DAO?',o:['Encapsular la lógica para llevar datos entre las clases del dominio y la persistencia.','Transportar datos entre la capa de negocio y la pantalla, sin contener lógica alguna.','Orquestar los casos de uso y decidir qué reglas de negocio se aplican en cada uno.','Presentar los datos al usuario y validar lo que ingresa en cada pantalla del sistema.'],a:[0],e:'Es el empleado del depósito: el único autorizado a entrar a la base de datos.',f:'Práctica DAO y DTO · DAO'},
{id:'B07',t:'dao',s:'N',m:1,q:'¿Qué operaciones ofrece típicamente un DAO?',o:['Añadir','Actualizar','Buscar','Borrar','Renderizar'],a:[0,1,2,3],e:'Son las operaciones CRUD, más los métodos extra que se necesiten.',f:'Práctica DAO y DTO · DAO'},
{id:'B08',t:'dao',s:'N',q:'En el TP, un candidato ve su cuestionario y un consultor administra candidatos. ¿Qué diseño de DTO es el adecuado?',o:['Dos DTO distintos, cada uno solo con los datos que necesita cada pantalla.','Un único DTO con todos los atributos, y que cada pantalla oculte los que sobran.','Ningún DTO: ambas pantallas pueden recibir directamente la entidad Candidato.','Un DAO distinto por pantalla, cada uno con su propia conexión a la base.'],a:[0],e:'Es el ejercicio de la práctica: CandidatoGestionDTO y CandidatoCuestionarioDTO.',f:'Práctica DAO y DTO · Ejercicio práctico'},
{id:'B09',t:'dao',s:'N',q:'¿Qué capa se comunica con el DAO en un esquema Pantalla, Gestor y DAO?',o:['La capa de lógica de negocio, a través del Gestor.','La capa de presentación, a través de la Pantalla.','Las dos, porque ambas necesitan acceder a los datos.','Ninguna: el DAO inicia las consultas por su cuenta.'],a:[0],e:'La presentación pide al gestor, y el gestor usa la interfaz DAO.',f:'Práctica DAO y DTO; Práctica 11/09/26'},

/* ---------- U5 · SOLID ---------- */
{id:'L01',t:'solid',s:'S',q:'El Principio de Inversión de Dependencias indica que:',o:['Los módulos de alto nivel no deben depender de los de bajo nivel: ambos dependen de abstracciones.','Los módulos de bajo nivel deben depender directamente de las clases concretas de alto nivel.','Cada clase debe tener una sola razón para cambiar, y depender de un único módulo concreto.','Las subclases deben poder sustituir a sus clases base sin afectar la integridad del programa.'],a:[0],e:'Además, las abstracciones no dependen de los detalles: los detalles dependen de las abstracciones.',f:'U5.4 · DIP'},
{id:'L02',t:'solid',s:'S',q:'La subclase Pinguino hereda Volar() de Ave y lanza una excepción al ejecutarlo. ¿Qué principio se viola?',o:['LSP','SRP','OCP','DIP'],a:[0],e:'Una subclase debe poder sustituir a la clase base sin afectar la integridad del programa.',f:'U5.4 · LSP: ejemplo'},
{id:'L03',t:'solid',s:'N',q:'ReportManager genera el informe, lo guarda en un archivo y lo envía por mail. ¿Qué principio viola?',o:['SRP','OCP','LSP','ISP'],a:[0],e:'Tiene tres razones para cambiar: el formato, el destino y el proveedor de correo.',f:'U5.4 · SRP: ejemplo'},
{id:'L04',t:'solid',s:'N',q:'CalculadoraDeArea usa if (figura is Circulo) ... else if (figura is Rectangulo), y cada figura nueva obliga a modificar el método. ¿Qué principio viola?',o:['OCP','SRP','LSP','ISP'],a:[0],e:'Debe estar abierta a la extensión y cerrada a la modificación: con IFigura, una figura nueva es una clase nueva.',f:'U5.4 · OCP: ejemplo'},
{id:'L05',t:'solid',s:'N',q:'IVehiculo declara Conducir(), Volar() y Navegar(), y Auto queda con métodos vacíos. ¿Qué principio viola?',o:['ISP','SRP','OCP','DIP'],a:[0],e:'Una clase no debería verse obligada a depender de métodos que no utiliza.',f:'U5.4 · ISP: ejemplo'},
{id:'L06',t:'solid',s:'N',q:'¿Qué principio viola esta clase de alto nivel?',c:'class OrderService {\n    private EmailService notifier = new EmailService();\n}',o:['DIP','LSP','ISP','OCP'],a:[0],e:'Depende de una clase concreta de bajo nivel y la crea por sí misma. Debería recibir una abstracción.',f:'U5.4 · DIP'},
{id:'L07',t:'solid',s:'N',q:'¿Cuál es la relación entre inversión de control (IoC) e inyección de dependencias (DI)?',o:['Toda DI aplica IoC, pero no toda IoC usa DI.','Toda IoC usa DI, pero no toda DI aplica IoC.','Son sinónimos: designan exactamente lo mismo.','Son independientes y no pueden combinarse.'],a:[0],e:'Los callbacks o los eventos son IoC sin DI.',f:'U5.4 · ¿Qué es DI?'},
{id:'L08',t:'solid',s:'N',m:1,q:'¿Cuáles son formas de inyección de dependencias presentadas en el apunte?',o:['Por constructor','Por propiedad','Por método','Por herencia múltiple'],a:[0,1,2],e:'En todas, la clase ya no crea sus dependencias, sino que las recibe.',f:'U5.4 · ¿Qué es DI?'},
{id:'L09',t:'solid',s:'N',m:1,q:'¿Por qué importan los principios SOLID?',o:['Reducen el acoplamiento entre componentes.','Facilitan el mantenimiento y la evolución.','Hacen el código más testeable y reutilizable.','Eliminan la necesidad de probar el código.'],a:[0,1,2],e:'Facilitan las pruebas, pero no las reemplazan.',f:'U5.4 · ¿Por qué importan?'},
{id:'L10',t:'solid',s:'N',q:'¿Cómo se corrige la violación de LSP del ejemplo Ave y Pinguino?',o:['Se mueve Volar() a una interfaz que implementan solo las aves que vuelan.','Se deja Volar() en Ave, y Pinguino lo sobrescribe con un método vacío.','Se agrega un if en el cliente para no invocar Volar() en pingüinos.','Se hace que Ave herede de Pinguino y se elimina el método Volar().'],a:[0],e:'Ave declara solo lo que todas cumplen. Un método vacío o un if en el cliente mantienen el problema.',f:'U5.4 · LSP: ejemplo'},
{id:'L11',t:'solid',s:'N',q:'El gestor recibe por constructor un LibroDAO y nunca conoce si es MySQL o Mongo. ¿Qué se está aplicando?',o:['Inversión de dependencias, mediante inyección','Segregación de interfaces, mediante herencia','Responsabilidad única, mediante un Singleton','Sustitución de Liskov, mediante condicionales'],a:[0],e:'La lógica depende de una abstracción y la implementación se inyecta desde afuera.',f:'Práctica DAO y DTO; U5.4 · DIP'},
{id:'L12',t:'solid',s:'N',q:'¿Qué significa, en términos prácticos, que una clase esté «cerrada a la modificación» según OCP?',o:['Se puede extender su comportamiento sin modificar su código existente.','No se le pueden agregar subclases ni implementaciones nuevas nunca.','Sus atributos deben ser privados, y sus métodos deben ser estáticos.','Solo puede corregirse con un proceso formal aprobado por el equipo.'],a:[0],e:'Reduce el impacto de los cambios y evita romper lo que ya estaba probado.',f:'U5.4 · OCP'},

/* ---------- U5 · Arquitectura ---------- */
{id:'R01',t:'arq',s:'S',q:'Durante el Black Friday, el servidor llega al 100 % de CPU y se lo cambia por uno con el doble de CPU y RAM. ¿Qué escalamiento es y cuál es su límite?',o:['Vertical; el hardware tiene un límite.','Horizontal; el hardware tiene un límite.','Vertical; necesita un servidor primario.','Horizontal; necesita un servidor primario.'],a:[0],e:'Horizontal agrega nodos en un cluster y necesita un servidor primario que lo administre.',f:'U5.5 · Escalabilidad; ¿Qué respondés?'},
{id:'R02',t:'arq',s:'S',m:1,q:'¿Cuáles de estas suposiciones son falacias de la computación distribuida?',o:['La latencia es cero.','La red es confiable.','La topología de la red no cambia.','Existe un solo administrador.','Una llamada remota puede fallar.'],a:[0,1,2,3],e:'Las falacias son suposiciones falsas. Que una llamada remota pueda fallar es cierto, y hay que asumirlo.',f:'U5.5 · 8 falacias'},
{id:'R03',t:'arq',s:'S',q:'En una arquitectura de capas cerradas, la presentación consulta directamente la persistencia para que un reporte cargue más rápido. ¿Qué problema genera?',o:['Rompe el aislamiento de las capas y acopla la interfaz a los datos.','Mejora el aislamiento, porque la capa de negocio queda sin cambios.','Ninguno, porque en capas cerradas cualquier capa se puede saltear.','Convierte el sistema en una arquitectura distribuida de microservicios.'],a:[0],e:'En una capa cerrada, una petición debe pasar por ella para llegar a la siguiente.',f:'U5.5 · ¿Qué respondés?'},
{id:'R04',t:'arq',s:'N',q:'El servicio Pedidos llama a Pagos sin timeouts ni reintentos porque «siempre responde». Un día, Pagos se cae y Pedidos queda colgado. ¿Qué falacia se cometió?',o:['La red es confiable.','La latencia es cero.','La red es homogénea.','La topología no cambia.'],a:[0],e:'Se asumió que la comunicación por red siempre funciona.',f:'U5.5 · ¿Qué respondés?'},
{id:'R05',t:'arq',s:'N',q:'Una panadería quiere vender online con 3 desarrolladores, poco presupuesto y 3 meses de plazo. ¿Qué estilo es más razonable para empezar?',o:['Monolito en capas','Microservicios','Basado en eventos con broker','Microkernel'],a:[0],e:'Es simple y barato. Microservicios sería sobrediseño para ese equipo y ese plazo.',f:'U5.5 · ¿Qué propondrías?'},
{id:'R06',t:'arq',s:'N',q:'Un editor de código tiene una funcionalidad base mínima, y terceros instalan extensiones para agregar lenguajes o temas. ¿Qué estilo lo describe mejor?',o:['Microkernel','Flujo de datos','Centrado en los datos','Modelo-Vista-Controlador'],a:[0],e:'Tiene un sistema central mínimo más plug-ins independientes.',f:'U5.5 · ¿Qué propondrías?'},
{id:'R07',t:'arq',s:'N',q:'Un sistema recibe logs, los limpia, filtra errores, los transforma a JSON y los agrega en un reporte. Cada paso solo recibe la salida del anterior. ¿Qué estilo es?',o:['Flujo de datos','Microkernel','Solicitud-respuesta','Basado en servicios'],a:[0],e:'Son filtros conectados por tubos.',f:'U5.5 · ¿Qué propondrías?'},
{id:'R08',t:'arq',s:'N',q:'«Solo las capas de negocio y de servicios pueden acceder a persistencia». Dentro de las dimensiones de la arquitectura, esto es:',o:['Una decisión arquitectónica','Un principio de diseño','Una característica','Un estilo arquitectónico'],a:[0],e:'Una decisión es una regla que debe cumplirse; un principio es una guía no obligatoria.',f:'U5.5 · Decisiones arquitectónicas'},
{id:'R09',t:'arq',s:'N',q:'«Preferir, cuando sea posible, mensajería asíncrona entre servicios para mejorar el rendimiento». Esto es:',o:['Un principio de diseño','Una decisión arquitectónica','Un conector','Un modelo semántico'],a:[0],e:'Es una recomendación, por lo que no es obligatoria.',f:'U5.5 · Principios de diseño'},
{id:'R10',t:'arq',s:'N',q:'Los módulos de un sistema son CatalogCheckout, UpdateInventory y ShipToCustomer. ¿Qué partición arquitectónica usa?',o:['Por dominio','Técnica','Por capas','Por tiers'],a:[0],e:'Se divide por área de negocio. La técnica divide por tipo de código: presentación, negocio, persistencia.',f:'U5.5 · Partición arquitectónica'},
{id:'R11',t:'arq',s:'N',m:1,q:'¿Qué incluye un estilo arquitectónico?',o:['Componentes que realizan una función.','Conectores para comunicar y coordinar.','Restricciones de integración.','Modelos semánticos.','Un cronograma de construcción.'],a:[0,1,2,3],e:'Son los cuatro elementos del apunte.',f:'U5.5 · Estilos arquitectónicos'},
{id:'R12',t:'arq',s:'N',q:'¿Qué diferencia a la arquitectura de microservicios de la basada en servicios?',o:['Microservicios usa muchos servicios chicos con BD propia; la otra, pocos servicios grandes con BD compartida.','Microservicios usa pocos servicios grandes con BD compartida; la otra, muchos servicios chicos con BD propia.','Microservicios se despliega como una sola unidad; la otra se despliega como servicios independientes.','Microservicios no se comunica por la red; la otra se comunica únicamente mediante un mediador central.'],a:[0],e:'Ambas son distribuidas y con partición por dominio; cambian la granularidad y los datos.',f:'U5.5 · Estilos; Richards y Ford'},
{id:'R13',t:'arq',s:'N',q:'En una arquitectura basada en eventos, ¿qué distingue a la topología broker de la topología mediador?',o:['Broker no tiene coordinador: cada procesador reacciona y publica. Mediador orquesta los pasos desde un punto central.','Mediador no tiene coordinador: cada procesador reacciona y publica. Broker orquesta los pasos desde un punto central.','Broker solo admite un procesador por cada evento. Mediador solo admite comunicación síncrona por solicitud-respuesta.','Broker es una arquitectura monolítica en capas. Mediador es una arquitectura de flujo de datos con filtros y tubos.'],a:[0],e:'La topología mediador es el patrón Mediator en grande.',f:'U5.5 · Arquitectura basada en eventos'},
{id:'R14',t:'arq',s:'N',m:1,q:'Respecto del escalamiento horizontal, ¿qué afirmaciones son correctas?',o:['Aumenta el número de servidores (nodos) que trabajan como un todo.','El trabajo se reparte entre los nodos de un cluster.','Se necesita un servidor primario que administre el cluster.','Es el más simple, porque el software no se entera del cambio.'],a:[0,1,2],e:'El apunte lo describe como el más potente y también el más complicado. Lo simple es el vertical.',f:'U5.5 · Escalabilidad'},
